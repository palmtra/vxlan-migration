---
- name: Converge service_db
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    project_root: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"
    service_db_dir: "{{ project_root }}/molecule/service_db/fixtures/services"
    target_data_center: lisle
    manual_service_id: demo_svc
  tasks:
    - name: Load service bundle fixture
      ansible.builtin.include_role:
        name: service_db

    - name: Load VLAN DB after service seeds target_vlan_ids
      ansible.builtin.include_role:
        name: vlan_db
