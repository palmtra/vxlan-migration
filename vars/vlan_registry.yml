---
# -----------------------------------------------------------------------------
# Canonical VLAN registry for cvg-vxlan
# -----------------------------------------------------------------------------
# Each entry describes a legacy VLAN to provision in the VXLAN fabric.
#
# Required fields:
#   id, name, action, vni, vlan_name, vrf, mcast_group
# -----------------------------------------------------------------------------

vlans:
  - id: 100
    name: legacy_web
    action: migrate
    vlan_name: WEB_VXLAN
    vni: 50100
    vrf: default
    mcast_group: "239.1.1.100"

  - id: 200
    name: legacy_app
    action: migrate
    vlan_name: APP_VXLAN
    vni: 50200
    vrf: default
    mcast_group: "239.1.1.200"
