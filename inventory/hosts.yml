---
# -----------------------------------------------------------------------------
# Inventory layout
# -----------------------------------------------------------------------------
# OS families: eos_devices, nxos_devices, ios_devices
# Data centers: dc_lisle, dc_omaha
# A host belongs to one OS group and one DC group.
# -----------------------------------------------------------------------------

all:
  children:
    network_devices:
      children:
        eos_devices:
          children:
            eos_lisle:
              hosts:
                eos-leaf-lis-01:
                  ansible_host: 10.1.0.11
                  data_center: lisle
                eos-leaf-lis-02:
                  ansible_host: 10.1.0.12
                  data_center: lisle
            eos_omaha:
              hosts:
                eos-leaf-oma-01:
                  ansible_host: 10.2.0.11
                  data_center: omaha
                eos-leaf-oma-02:
                  ansible_host: 10.2.0.12
                  data_center: omaha

        nxos_devices:
          children:
            nxos_lisle:
              hosts:
                nxos-spine-lis-01:
                  ansible_host: 10.1.0.21
                  data_center: lisle
                nxos-spine-lis-02:
                  ansible_host: 10.1.0.22
                  data_center: lisle
            nxos_omaha:
              hosts:
                nxos-spine-oma-01:
                  ansible_host: 10.2.0.21
                  data_center: omaha
                nxos-spine-oma-02:
                  ansible_host: 10.2.0.22
                  data_center: omaha

        ios_devices:
          children:
            ios_lisle:
              hosts:
                ios-leaf-lis-01:
                  ansible_host: 10.1.0.31
                  data_center: lisle
            ios_omaha:
              hosts:
                ios-leaf-oma-01:
                  ansible_host: 10.2.0.31
                  data_center: omaha

    dc_lisle:
      children:
        eos_lisle:
        nxos_lisle:
        ios_lisle:

    dc_omaha:
      children:
        eos_omaha:
        nxos_omaha:
        ios_omaha:

    controllers:
      hosts:
        vtep-controller-01:
          ansible_host: 10.0.0.5

  vars:
    ansible_user: "{{ vault_ansible_user | default(lookup('env', 'ANSIBLE_NET_USER')) }}"
    ansible_password: "{{ vault_ansible_password | default(lookup('env', 'ANSIBLE_NET_PASS')) }}"
    ansible_connection: network_cli
    ansible_become: false
