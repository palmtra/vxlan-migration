---
# -----------------------------------------------------------------------------
# Inventory layout
# -----------------------------------------------------------------------------
# Hosts are defined once, in a role-per-DC group:
#   <dc>_vteps      Arista VXLAN/EVPN leaves (AVD + CVaaS). VNI targets.
#   <dc>_non_vtep   Switches that are not VTEPs (L2 extensions hanging off a
#                   leaf). They keep the VLAN as plain L2 behind a VTEP and get
#                   light discovery (VLAN, ports, MACs, neighbors, STP).
#   <dc>_mls        Legacy MLS / core being retired. Omaha: Nexus 7010 vPC
#                   pair (NX-OS 8.4). Lisle: Arista MLAG pair (legacy, not a VTEP).
# Every other group is built from those:
#   OS groups:   eos_devices, nxos_devices (network_os_family, CLI modules)
#   Role groups: vtep_leaves, non_vtep_switches, legacy_mls (migration_tier)
#   DC groups:   dc_lisle, dc_omaha (--limit and the per-DC VLAN database)
# IOS is out of scope (ios_devices stays empty; see docs/OS_SUPPORT.md).
# -----------------------------------------------------------------------------

all:
  # Explicit localhost for control-node tasks (state persist/resume, NetBox lookups).
  # Implicit localhost does not reliably survive --limit filtering.
  hosts:
    localhost:
      ansible_connection: local
      ansible_python_interpreter: "{{ ansible_playbook_python }}"

  children:
    network_devices:
      children:
        eos_devices:
          children:
            lisle_vteps:
              hosts:
                eos-leaf-lis-01:
                  ansible_host: 10.1.0.11
                  data_center: lisle
                eos-leaf-lis-02:
                  ansible_host: 10.1.0.12
                  data_center: lisle
            lisle_non_vtep:
              hosts:
                eos-acc-lis-01:
                  ansible_host: 10.1.0.41
                  data_center: lisle
            lisle_mls:
              hosts:
                eos-mls-lis-01:
                  ansible_host: 10.1.0.21
                  data_center: lisle
                eos-mls-lis-02:
                  ansible_host: 10.1.0.22
                  data_center: lisle
            omaha_vteps:
              hosts:
                eos-leaf-oma-01:
                  ansible_host: 10.2.0.11
                  data_center: omaha
                eos-leaf-oma-02:
                  ansible_host: 10.2.0.12
                  data_center: omaha
            omaha_non_vtep:
              hosts:
                eos-acc-oma-01:
                  ansible_host: 10.2.0.41
                  data_center: omaha
        nxos_devices:
          children:
            omaha_mls:
              hosts:
                nxos-mls-oma-01:
                  ansible_host: 10.2.0.21
                  data_center: omaha
                nxos-mls-oma-02:
                  ansible_host: 10.2.0.22
                  data_center: omaha
        # Out of scope. Kept so group_vars/ios_devices.yml still resolves.
        ios_devices:
          hosts: {}

    vtep_leaves:
      children:
        lisle_vteps:
        omaha_vteps:

    non_vtep_switches:
      children:
        lisle_non_vtep:
        omaha_non_vtep:

    legacy_mls:
      children:
        lisle_mls:
        omaha_mls:

    dc_lisle:
      children:
        lisle_vteps:
        lisle_non_vtep:
        lisle_mls:

    dc_omaha:
      children:
        omaha_vteps:
        omaha_non_vtep:
        omaha_mls:

    # CloudVision as a Service / on-prem CVP controller.
    # Group vars live in inventory/group_vars/CVAAS/.
    CVAAS:
      hosts:
        cvp:
          ansible_host: www.cv-prod-us-central1-c.arista.io

  # Device credentials and integration endpoints are supplied via Ansible Vault,
  # AAP credentials, or a scoped variable file. See inventory/group_vars/all/.
