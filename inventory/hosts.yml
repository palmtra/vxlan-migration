---
# -----------------------------------------------------------------------------
# Inventory layout
# -----------------------------------------------------------------------------
# Hosts are defined once, in a role-per-DC group:
#   <dc>_vteps      Arista VXLAN/EVPN leaves (AVD + CVaaS). VNI targets.
#   <dc>_non_vtep   Switches that are not VTEPs (L2 extensions hanging off a
#                   leaf). They keep the VLAN as plain L2 behind a VTEP and get
#                   light discovery (VLAN, ports, MACs, neighbors, STP).
#   <dc>_mls        Legacy MLS / core being retired. Omaha: Nexus 7010 vPC
#                   pair (NX-OS 8.4). Lisle: Arista MLAG pair (legacy, not a VTEP).
# Both DCs are production. border_leaf: true marks the border pair: external
# gateways (firewalls) attach there, and discovery looks the VLAN subnets up in
# its BGP table (same AS as the legacy MLS, so the MLS's routes arrive over iBGP).
# Every other group is built from those:
#   OS groups:   eos_devices, nxos_devices (network_os_family, CLI modules)
#   Role groups: vtep_leaves, non_vtep_switches, legacy_mls (migration_tier)
#   DC groups:   dc_lisle, dc_omaha (--limit and the per-DC VLAN database)
# IOS is out of scope (ios_devices stays empty; see docs/OS_SUPPORT.md).
# -----------------------------------------------------------------------------

all:
  # Explicit localhost for control-node tasks (state persist/resume, NetBox lookups).
  # Implicit localhost does not reliably survive --limit filtering.
  hosts:
    localhost:
      ansible_connection: local
      ansible_python_interpreter: "{{ ansible_playbook_python }}"

  children:
    network_devices:
      children:
        eos_devices:
          children:
            # Lisle (chi01). MLAG pairs are listed together. bgp_as and
            # router_id (Loopback0, the RD admin field) are the fallback when
            # discovery cannot read them from the switch. bgp_as is written as
            # the switch shows it (asplain or asdot).
            lisle_vteps:
              hosts:
                chi01-blf01:
                  ansible_host: 10.252.76.19
                  data_center: lisle
                  border_leaf: true
                  bgp_as: "20034"
                  router_id: 66.180.0.17
                chi01-blf02:
                  ansible_host: 10.252.76.20
                  data_center: lisle
                  border_leaf: true
                  bgp_as: "20034"
                  router_id: 66.180.0.18
                fnts-chi01-aggacc-sw01:
                  ansible_host: 10.252.76.45
                  data_center: lisle
                  bgp_as: "4200000202"
                  router_id: 66.180.0.21
                fnts-chi01-aggacc-sw02:
                  ansible_host: 10.252.76.46
                  data_center: lisle
                  bgp_as: "4200000202"
                  router_id: 66.180.0.22
                # sw05/06 run `bgp asn notation asdot`: 64086.60107 (= 4200000203).
                fnts-chi01-aggacc-sw05:
                  ansible_host: 10.252.76.63
                  data_center: lisle
                  bgp_as: "64086.60107"
                  router_id: 66.180.0.23
                fnts-chi01-aggacc-sw06:
                  ansible_host: 10.252.76.64
                  data_center: lisle
                  bgp_as: "64086.60107"
                  router_id: 66.180.0.24
                fnts-chi01-aggacc-sw11:
                  ansible_host: 10.252.76.69
                  data_center: lisle
                  bgp_as: "4200000204"
                  router_id: 66.180.0.25
                fnts-chi01-aggacc-sw12:
                  ansible_host: 10.252.76.70
                  data_center: lisle
                  bgp_as: "4200000204"
                  router_id: 66.180.0.26
            lisle_non_vtep:
              hosts:
                fnts-chi01-aggacc-sw03: {ansible_host: 10.252.76.47, data_center: lisle}
                fnts-chi01-aggacc-sw04: {ansible_host: 10.252.76.48, data_center: lisle}
                fnts-chi01-aggacc-sw07: {ansible_host: 10.252.76.65, data_center: lisle}
                fnts-chi01-aggacc-sw08: {ansible_host: 10.252.76.66, data_center: lisle}
                fnts-chi01-aggacc-sw09: {ansible_host: 10.252.76.67, data_center: lisle}
                fnts-chi01-aggacc-sw10: {ansible_host: 10.252.76.68, data_center: lisle}
                fnts-chi01-aggacc-sw13: {ansible_host: 10.252.76.71, data_center: lisle}
                fnts-chi01-aggacc-sw14: {ansible_host: 10.252.76.72, data_center: lisle}
            # Legacy aggregation (Arista MLAG, not a VTEP) being retired. Same AS
            # as the border leaves.
            lisle_mls:
              hosts:
                fnts-chi01-aggpe-ml01: {ansible_host: 10.252.76.49, data_center: lisle, bgp_as: "20034"}
                fnts-chi01-aggpe-ml02: {ansible_host: 10.252.76.50, data_center: lisle, bgp_as: "20034"}
            # Omaha (fntc / oma). Same conventions as Lisle.
            omaha_vteps:
              hosts:
                oma01-blf01:
                  ansible_host: 10.252.12.6
                  data_center: omaha
                  border_leaf: true
                  bgp_as: "30452"
                  router_id: 66.180.0.3
                oma01-blf02:
                  ansible_host: 10.252.12.7
                  data_center: omaha
                  border_leaf: true
                  bgp_as: "30452"
                  router_id: 66.180.0.4
                fntc-aggacc-sw01:
                  ansible_host: 10.252.12.95
                  data_center: omaha
                  bgp_as: "4200000102"
                  router_id: 66.180.0.10
                fntc-aggacc-sw02:
                  ansible_host: 10.252.12.96
                  data_center: omaha
                  bgp_as: "4200000102"
                  router_id: 66.180.0.11
                fntc-aggacc-sw05:
                  ansible_host: 10.252.12.89
                  data_center: omaha
                  bgp_as: "4200000103"
                  router_id: 66.180.0.12
                fntc-aggacc-sw06:
                  ansible_host: 10.252.12.90
                  data_center: omaha
                  bgp_as: "4200000103"
                  router_id: 66.180.0.13
                fntc-aggacc-sw11:
                  ansible_host: 10.252.12.79
                  data_center: omaha
                  bgp_as: "4200000104"
                  router_id: 66.180.0.44
                fntc-aggacc-sw12:
                  ansible_host: 10.252.12.80
                  data_center: omaha
                  bgp_as: "4200000104"
                  router_id: 66.180.0.45
                fntc-aggacc-sw13:
                  ansible_host: 10.252.12.106
                  data_center: omaha
                  bgp_as: "4200000105"
                  router_id: 66.180.0.42
                fntc-aggacc-sw14:
                  ansible_host: 10.252.12.107
                  data_center: omaha
                  bgp_as: "4200000105"
                  router_id: 66.180.0.43
                # sw101/102 BGP is in asdot: 64086.60005 (= 4200000101).
                fntc-aggacc-sw101:
                  ansible_host: 10.252.12.87
                  data_center: omaha
                  bgp_as: "64086.60005"
                  router_id: 66.180.0.40
                fntc-aggacc-sw102:
                  ansible_host: 10.252.12.88
                  data_center: omaha
                  bgp_as: "64086.60005"
                  router_id: 66.180.0.41
                oma-ce-sw01:
                  ansible_host: 10.252.12.110
                  data_center: omaha
                  bgp_as: "4200000106"
                  router_id: 66.180.0.46
                oma-ce-sw02:
                  ansible_host: 10.252.12.111
                  data_center: omaha
                  bgp_as: "4200000106"
                  router_id: 66.180.0.47
            omaha_non_vtep:
              hosts:
                fntc-aggacc-sw03: {ansible_host: 10.252.12.93, data_center: omaha}
                fntc-aggacc-sw04: {ansible_host: 10.252.12.94, data_center: omaha}
                fntc-aggacc-sw07: {ansible_host: 10.252.12.91, data_center: omaha}
                fntc-aggacc-sw08: {ansible_host: 10.252.12.92, data_center: omaha}
                fntc-aggacc-sw15: {ansible_host: 10.252.12.108, data_center: omaha}
                fntc-aggacc-sw16: {ansible_host: 10.252.12.109, data_center: omaha}
                oma-ce-sw03: {ansible_host: 10.252.12.112, data_center: omaha}
                oma-ce-sw04: {ansible_host: 10.252.12.113, data_center: omaha}
                oma-ce-sw05: {ansible_host: 10.252.12.114, data_center: omaha}
                oma-ce-sw06: {ansible_host: 10.252.12.115, data_center: omaha}
                oma-ce-sw07: {ansible_host: 10.252.12.116, data_center: omaha}
                oma-ce-sw08: {ansible_host: 10.252.12.117, data_center: omaha}
        nxos_devices:
          children:
            # Legacy N7K vPC pair being retired. Same AS as the border leaves.
            omaha_mls:
              hosts:
                fnts-fntc03-aggpe-mls01: {ansible_host: 10.252.12.81, data_center: omaha, bgp_as: "30452"}
                fnts-fntc03-aggpe-mls02: {ansible_host: 10.252.12.82, data_center: omaha, bgp_as: "30452"}
        # Out of scope. Kept so group_vars/ios_devices.yml still resolves.
        ios_devices:
          hosts: {}

    vtep_leaves:
      children:
        lisle_vteps:
        omaha_vteps:

    non_vtep_switches:
      children:
        lisle_non_vtep:
        omaha_non_vtep:

    legacy_mls:
      children:
        lisle_mls:
        omaha_mls:

    dc_lisle:
      children:
        lisle_vteps:
        lisle_non_vtep:
        lisle_mls:

    dc_omaha:
      children:
        omaha_vteps:
        omaha_non_vtep:
        omaha_mls:

    # CloudVision as a Service / on-prem CVP controller.
    # Group vars live in inventory/group_vars/CVAAS/.
    CVAAS:
      hosts:
        cvp:
          ansible_host: www.cv-prod-us-central1-c.arista.io

  # Device credentials and integration endpoints are supplied via Ansible Vault,
  # AAP credentials, or a scoped variable file. See inventory/group_vars/all/.
