---
# -----------------------------------------------------------------------------
# Inventory layout
# -----------------------------------------------------------------------------
# Active on main: eos_devices (target) + nxos_devices (legacy source).
# ios_devices remain for optional reuse; discovery skips IOS unless
# discovery_enable_ios=true. See docs/OS_SUPPORT.md.
# Data centers: dc_lisle, dc_omaha
# A host belongs to one OS group and one DC group.
# -----------------------------------------------------------------------------

all:
  # Explicit localhost for control-node tasks (state persist/resume, NetBox lookups).
  # Implicit localhost does not reliably survive --limit filtering.
  hosts:
    localhost:
      ansible_connection: local
      ansible_python_interpreter: "{{ ansible_playbook_python }}"

  children:
    network_devices:
      children:
        eos_devices:
          children:
            eos_lisle:
              hosts:
                eos-leaf-lis-01:
                  ansible_host: 10.1.0.11
                  data_center: lisle
                eos-leaf-lis-02:
                  ansible_host: 10.1.0.12
                  data_center: lisle
            eos_omaha:
              hosts:
                eos-leaf-oma-01:
                  ansible_host: 10.2.0.11
                  data_center: omaha
                eos-leaf-oma-02:
                  ansible_host: 10.2.0.12
                  data_center: omaha

        nxos_devices:
          children:
            nxos_lisle:
              hosts:
                nxos-spine-lis-01:
                  ansible_host: 10.1.0.21
                  data_center: lisle
                nxos-spine-lis-02:
                  ansible_host: 10.1.0.22
                  data_center: lisle
            nxos_omaha:
              hosts:
                nxos-spine-oma-01:
                  ansible_host: 10.2.0.21
                  data_center: omaha
                nxos-spine-oma-02:
                  ansible_host: 10.2.0.22
                  data_center: omaha

        ios_devices:
          # Parked on main (NXOS→EOS focus). Hosts kept for reuse / lab inventory.
          # Discovery is skipped unless discovery_enable_ios=true.
          # Snapshot: tag archive/multi-os-ios-nxos-eos-2026-08, branch archive/ios-discovery
          children:
            ios_lisle:
              hosts:
                ios-leaf-lis-01:
                  ansible_host: 10.1.0.31
                  data_center: lisle
            ios_omaha:
              hosts:
                ios-leaf-oma-01:
                  ansible_host: 10.2.0.31
                  data_center: omaha

    dc_lisle:
      children:
        eos_lisle:
        nxos_lisle:
        ios_lisle:

    dc_omaha:
      children:
        eos_omaha:
        nxos_omaha:
        ios_omaha:

    controllers:
      hosts:
        vtep-controller-01:
          ansible_host: 10.0.0.5

    # CloudVision as a Service / on-prem CVP controller.
    # Group vars live in inventory/group_vars/CVAAS/.
    CVAAS:
      hosts:
        cvp:
          ansible_host: www.cv-prod-us-central1-c.arista.io

  # Device credentials and integration endpoints are supplied via Ansible Vault,
  # AAP credentials, or a scoped variable file. See inventory/group_vars/all/.
