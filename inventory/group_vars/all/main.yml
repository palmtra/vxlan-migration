---
# -----------------------------------------------------------------------------
# Global variables for vxlan-migration
# -----------------------------------------------------------------------------

# Normalize repo root whether playbooks run from playbooks/ or playbooks/core/.
project_root: "{{ playbook_dir | regex_replace('/playbooks(/core|/advanced)?$', '') }}"
# Artifacts root - override with -e artifacts_dir=... or env ARTIFACTS_DIR (AAP EE mounts).
artifacts_dir: "{{ lookup('env', 'ARTIFACTS_DIR') | default(project_root, true) }}"
reports_dir: "{{ artifacts_dir }}/reports"
network_backup_dir: "{{ artifacts_dir }}/backups/{{ inventory_hostname }}"

# Load the per-DC VLAN database directory (primary SSOT for Core workflow).
vlan_db_dir: "{{ project_root }}/vars/vlans"

# Workflow tier: core (no ServiceNow) or advanced (ServiceNow callbacks enabled).
workflow_tier: core

# NetBox is secondary in Core workflow. Set true in Advanced when NetBox is mature.
netbox_ssot_required: false

# When true, every change playbook will save a local backup per host.
network_backup_enabled: true

# VXLAN fabric defaults used by the migration role
vtep_loopback_id: 0
vtep_source_interface: "Loopback{{ vtep_loopback_id }}"

# Default multicast group for VXLAN BUM traffic. Leave empty and set per-VLAN
# mcast_group, or set a real fabric value. Placeholder 239.1.1.1 is rejected
# unless allow_placeholder_fabric_defaults=true.
vxlan_default_mcast_group: ""

# When true, allow lab placeholder fabric values (mcast 239.1.1.1, empty ASN).
# Keep false for production.
allow_placeholder_fabric_defaults: false

# Optional EVPN AFIs to enable on VNI.  Disable if your fabric is multicast only.
# This is an example of a design-parameter that should be promoted to per-VLAN data.
evpn_enabled: false

# Scope controls. AAP surveys can inject these to limit blast radius.
# Empty target_vlan_ids means all VLANs in the registry.
target_vlan_ids: []
target_actions:
  - migrate

# When true, a failed post-change verification in workflow_verify.yml
# automatically attempts a rollback via roles/cvp_rollback and re-verifies
# before escalating. Default false: auto-rollback with destructive "no vlan"
# is unsafe until baseline-aware restore exists.
auto_rollback_on_verification_failure: false

# When true, rollback configlets may emit "no vlan" / VRF teardown. Default
# false only removes VXLAN mappings (safer if the VLAN pre-existed).
cvp_rollback_allow_destructive_no_vlan: false

# When true, use arista.avd.eos_cli_config_gen for EOS configlet generation
# instead of the legacy custom Jinja templates in roles/cvp_deploy.
use_avd: false

# Default BGP ASN used for AVD-generated router_bgp sections.
# Per-device values can be set as hostvars (bgp_as / router_id). Required when
# evpn_enabled=true unless allow_placeholder_fabric_defaults=true.
avd_default_bgp_as: ""

# -----------------------------------------------------------------------------
# Integration endpoints (override via variable file, Ansible Vault, or AAP credentials)
# -----------------------------------------------------------------------------
# NetBox read-only lookup performed by roles/netbox_check.
netbox_url: ""
netbox_token: ""

# Arista CVP / CVAAS endpoint used by roles/cvp_deploy.
cvp_url: ""
cvp_token: ""

# ServiceNow change-ticket integration used by roles/servicenow_input (intake)
# and roles/servicenow_update (status callbacks). snow_ticket_sys_id is
# normally injected per-run by the ServiceNow webhook payload, not set here.
snow_url: ""
snow_username: ""
snow_password: ""
snow_table: "change_request"
snow_enable_callbacks: true

# Connection defaults for network devices
ansible_connection: network_cli
ansible_become: false
