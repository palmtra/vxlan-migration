---
# -----------------------------------------------------------------------------
# Global variables for cvg-vxlan
# -----------------------------------------------------------------------------

# Load the per-DC VLAN database directory (primary SSOT for Core workflow).
vlan_db_dir: "{{ playbook_dir }}/../vars/vlans"

# Deprecated monolithic registry path — kept for older playbooks only.
vlan_registry_file: "{{ playbook_dir }}/../vars/vlan_registry.yml"

# Workflow tier: core (no ServiceNow) or advanced (ServiceNow callbacks enabled).
workflow_tier: core

# NetBox is secondary in Core workflow. Set true in Advanced when NetBox is mature.
netbox_ssot_required: false

# When true, every change playbook will save a local backup per host.
network_backup_enabled: true
network_backup_dir: "{{ playbook_dir }}/../backups/{{ inventory_hostname }}"

# VXLAN fabric defaults used by the migration role
vtep_loopback_id: 0
vtep_source_interface: "Loopback{{ vtep_loopback_id }}"

# Default multicast group for VXLAN BUM traffic.  Replace with your fabric value
# (unicast HER, ingress replication, or EVPN control-plane) as required.
vxlan_default_mcast_group: "239.1.1.1"

# Optional EVPN AFIs to enable on VNI.  Disable if your fabric is multicast only.
# This is an example of a design-parameter that should be promoted to per-VLAN data.
evpn_enabled: false

# Scope controls. AAP surveys can inject these to limit blast radius.
# Empty target_vlan_ids means all VLANs in the registry.
target_vlan_ids: []
target_actions:
  - migrate

# When true, a failed post-change verification in workflow_vlan_to_vxlan.yml
# automatically attempts a rollback via roles/cvp_rollback and re-verifies
# before escalating. When false, verification failure escalates immediately
# without attempting a rollback.
auto_rollback_on_verification_failure: true

# When true, use arista.avd.eos_cli_config_gen for EOS configlet generation
# instead of the legacy custom Jinja templates in roles/cvp_deploy.
use_avd: false

# Default BGP ASN used for AVD-generated router_bgp sections.
# Per-device values can be set as hostvars (bgp_as / router_id).
avd_default_bgp_as: ""

# -----------------------------------------------------------------------------
# Integration endpoints (override via variable file, Ansible Vault, or AAP credentials)
# -----------------------------------------------------------------------------
# NetBox read-only lookup performed by roles/netbox_check.
netbox_url: ""
netbox_token: ""

# Arista CVP / CVAAS endpoint used by roles/cvp_deploy.
cvp_url: ""
cvp_token: ""

# ServiceNow change-ticket integration used by roles/servicenow_input (intake)
# and roles/servicenow_update (status callbacks). snow_ticket_sys_id is
# normally injected per-run by the ServiceNow webhook payload, not set here.
snow_url: ""
snow_username: ""
snow_password: ""
snow_table: "change_request"
snow_enable_callbacks: true

# Connection defaults for network devices
ansible_connection: network_cli
ansible_become: false
