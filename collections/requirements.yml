---
# Every range below resolves to versions that support ansible-core 2.18,
# the controller version (see requirements.txt). arista.cvp caps the core:
# 3.12.0, its newest release, declares requires_ansible <2.19.
collections:
  - name: ansible.netcommon
    version: ">=8.5.2,<9.0.0"
  - name: cisco.ios
    version: ">=7.0.0,<10.0.0"
  - name: cisco.nxos
    version: ">=6.0.0,<10.0.0"
  - name: arista.eos
    version: ">=12.2.0,<15.0.0"
  - name: ansible.utils
    version: ">=3.0.0,<6.0.0"
  - name: arista.cvp
    version: ">=3.12.0,<4.0.0"
  # roles/avd_vxlan_config uses the AVD 6 API (validate_inputs + tmp_dir).
  # Exact pin: pyavd in requirements.txt must be the same version.
  - name: arista.avd
    version: "==6.4.0"
  - name: netbox.netbox
    version: ">=3.17.0,<5.0.0"
