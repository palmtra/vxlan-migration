---
# Test-only: run post_change_verification against the mock CLI, with the
# endpoint baseline written by the mock discovery run (reports_dir).
- name: Mock post-change verification for VLAN 300
  hosts: eos_devices
  gather_facts: false
  pre_tasks:
    - name: Seed the control-node facts verify reads
      ansible.builtin.set_fact:
        _target_vlan_record:
          id: 300
          name: APP_WEB
          vrf: TENANT1
          gateway_leafs: [eos-leaf-01]
      delegate_to: localhost
      delegate_facts: true
      run_once: true

    - name: Seed the VLAN selection on every host
      ansible.builtin.set_fact:
        _effective_vlans: [{id: 300}]
        vlan_registry: {vlans: [{id: 300, vni: 20000}]}

  roles:
    - post_change_verification

  post_tasks:
    - name: Write the endpoint check for the harness
      ansible.builtin.copy:
        content: "{{ _verification_results.endpoint_reachability | to_nice_json }}\n"
        dest: "{{ reports_dir }}/verify_endpoint_reachability.json"
        mode: "0644"
      delegate_to: localhost
      when: inventory_hostname == 'eos-leaf-01'
