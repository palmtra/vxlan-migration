---
# Mock inventory for tests/run_omaha_vlan3000_mock.sh: a slice of the real
# Omaha inventory (same names, ASNs, router-ids, groups). Every host runs
# locally and answers cli_command from tests/mock_cli/omaha/devices/<host>/.
all:
  hosts:
    localhost:
      ansible_connection: local
      ansible_python_interpreter: "{{ ansible_playbook_python }}"
  children:
    network_devices:
      children:
        eos_devices:
          vars:
            network_os_family: eos
          children:
            omaha_vteps:
              hosts:
                oma01-blf01:
                  data_center: omaha
                  border_leaf: true
                  bgp_as: "30452"
                  router_id: 66.180.0.3
                oma01-blf02:
                  data_center: omaha
                  border_leaf: true
                  bgp_as: "30452"
                  router_id: 66.180.0.4
                fntc-aggacc-sw01:
                  data_center: omaha
                  bgp_as: "4200000102"
                  router_id: 66.180.0.10
                fntc-aggacc-sw02:
                  data_center: omaha
                  bgp_as: "4200000102"
                  router_id: 66.180.0.11
                fntc-aggacc-sw05:
                  data_center: omaha
                  bgp_as: "4200000103"
                  router_id: 66.180.0.12
                fntc-aggacc-sw06:
                  data_center: omaha
                  bgp_as: "4200000103"
                  router_id: 66.180.0.13
            omaha_non_vtep:
              hosts:
                fntc-aggacc-sw03: {data_center: omaha}
        nxos_devices:
          vars:
            network_os_family: nxos
          children:
            omaha_mls:
              hosts:
                fnts-fntc03-aggpe-mls01: {data_center: omaha, bgp_as: "30452"}
                fnts-fntc03-aggpe-mls02: {data_center: omaha, bgp_as: "30452"}
    vtep_leaves:
      children:
        omaha_vteps:
    non_vtep_switches:
      children:
        omaha_non_vtep:
    legacy_mls:
      children:
        omaha_mls:
    dc_omaha:
      children:
        omaha_vteps:
        omaha_non_vtep:
        omaha_mls:
