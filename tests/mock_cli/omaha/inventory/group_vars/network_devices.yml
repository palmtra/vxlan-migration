---
# Overrides inventory/group_vars/all (network_cli) for the mock run. The VNI
# ranges are the real ones from inventory/group_vars/all/vni_ranges.yml.
ansible_connection: local
ansible_python_interpreter: "{{ ansible_playbook_python }}"
network_facts_module: ansible.builtin.debug
mock_cli_root: "{{ inventory_dir }}/.."
