---
# Mock inventory for tests/run_discovery_mock.sh. Every host runs locally and
# answers cli_command from tests/mock_cli/devices/<host>/.
all:
  hosts:
    localhost:
      ansible_connection: local
      ansible_python_interpreter: "{{ ansible_playbook_python }}"
  children:
    network_devices:
      children:
        eos_devices:
          vars:
            network_os_family: eos
          hosts:
            eos-leaf-01:
              data_center: lisle
            eos-leaf-02:
              data_center: lisle
              border_leaf: true
            acc-sw-01:
              data_center: lisle
              migration_tier: access
              discovery_profile: light
        nxos_devices:
          vars:
            network_os_family: nxos
          hosts:
            nxos-mls-01:
              data_center: lisle
            nxos-mls-02:
              data_center: lisle
            nxos-mls-99:
              data_center: lisle
              mock_unreachable: true
    dc_lisle:
      children:
        eos_devices:
        nxos_devices:
