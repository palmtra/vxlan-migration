---
# Runs this branch's tests against the code on main (or code_ref).
name: tests

on:
  push:
    branches: [test]
  pull_request:
    branches: [test]
  workflow_dispatch:
    inputs:
      code_ref:
        description: Branch, tag or SHA of the code to test
        default: main

jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code under test
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.code_ref || 'main' }}

      - name: Checkout this branch's tests
        uses: actions/checkout@v4
        with:
          path: .test-branch

      - name: Overlay tests and fixtures
        run: |
          cp -r .test-branch/tests .test-branch/molecule .
          rm -rf .test-branch

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt molecule

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r collections/requirements.yml -p collections/

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Discovery end to end (mock CLI)
        run: tests/run_discovery_mock.sh

      - name: Molecule (vlan_db + service_db)
        run: |
          molecule test -s vlan_db
          molecule test -s service_db
