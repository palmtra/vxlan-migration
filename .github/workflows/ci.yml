---
# .github/workflows/ci.yml — quality floor for vxlan-migration
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Test code and synthetic data (fixtures, mock devices, sample VLAN
      # records) live on the test branch only. This branch must not carry them.
      - name: No test code or synthetic data on this branch
        run: |
          tracked="$(git ls-files -- tests molecule 'vars/vlans/*/_*' 'vars/services/*/_*')"
          if [ -n "$tracked" ]; then
            echo "::error::Test code and synthetic data belong on the test branch, not here:"
            echo "$tracked"
            exit 1
          fi

      - name: Fetch tests and fixtures from the test branch (untracked)
        run: |
          git fetch --depth 1 origin test
          git archive FETCH_HEAD tests molecule | tar -x

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint and test tools
        run: |
          python -m pip install --upgrade pip
          pip install "ansible-core>=2.16,<2.19" ansible-lint yamllint PyYAML jsonschema molecule
          pip install -r requirements.txt

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r collections/requirements.yml -p collections/

      - name: Yamllint
        run: yamllint -c .yamllint .

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Discovery end to end (mock CLI)
        run: tests/run_discovery_mock.sh

      - name: Molecule (vlan_db + service_db)
        run: |
          molecule test -s vlan_db
          molecule test -s service_db

      - name: Ansible syntax-check (core playbooks)
        run: |
          set -e
          for pb in playbooks/core/*.yml playbooks/check_netbox.yml playbooks/export_vlan_to_netbox.yml; do
            echo "==> syntax-check $pb"
            ansible-playbook -i inventory/hosts.yml "$pb" --syntax-check
          done

      - name: Ansible-lint
        run: ansible-lint -c .ansible-lint
