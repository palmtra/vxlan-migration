---
# AAP Execution Environment definition
# Build with: ansible-builder build --tag cvg-vxlan-ee:latest
version: 3

images:
  base_image:
    name: registry.redhat.io/ansible-automation-platform-24/ee-minimal-rhel8:latest

dependencies:
  galaxy: ../collections/requirements.yml
  python: requirements.txt
  system: bindep.txt

additional_build_steps:
  prepend_base:
    - RUN pip install --upgrade pip
  append_base:
    - RUN echo "cvg-vxlan execution environment ready"
