---
# -----------------------------------------------------------------------------
# vlan_discovery defaults
# -----------------------------------------------------------------------------

discovery_reports_dir: "{{ reports_dir | default(playbook_dir | regex_replace('/playbooks(/core|/advanced)?$', '') ~ '/reports') }}"

# VLAN-centric reports (primary output format).
discovery_write_vlan_reports: true
discovery_write_csv: true
discovery_write_markdown: true
discovery_write_json: true
# YAML is the deployable model. JSON is the LLM analysis payload. Markdown is the short report.
discovery_write_yaml: true
discovery_write_vlan_db_snippet: true
# MOP input: one compact, schema-versioned JSON per VLAN (<vlan>_mop_input_<ts>.json,
# schemas/mop_input.schema.json) for whoever writes the MOP, human or LLM, and a
# run index across the run's VLANs with a SHA-256 manifest of every file written
# (reports/<dc>/_runs/run_<ts>.json and .md). See docs/MOP_INPUT.md.
discovery_write_mop_input: true
discovery_write_run_index: true
# The model YAML and VLAN DB snippet carry condensed routing (advertised
# prefix / VRF / ASN, statics, BGP peers on the VLAN). true adds the full
# per-switch BGP and static detail the reports show.
discovery_model_routing_detail: false
# A switch is kept for the VLAN only when MACs are learned on its endpoint-facing
# ports (or ARP / NetBox ties endpoints to it). Endpoint, fabric-interconnect,
# firewall / load balancer, unclassified and outside-switch ports with no MACs
# make it prune-eligible, with a warning naming them. true keeps such switches
# (participating, or review for unclassified / outside-switch ports).
discovery_keep_idle_endpoint_ports: false

# --- Endpoint tables (MAC, ARP, IPv6 neighbors) -------------------------------
# per_vlan: MAC and ARP read one VLAN at a time (text commands).
# bulk:     each switch's whole MAC, ARP and IPv6 neighbor tables read once as
#           JSON and split by VLAN. A switch whose JSON cannot be read falls
#           back to per_vlan, and the report says so.
# auto:     bulk when the run covers discovery_bulk_min_vlans VLANs or more;
#           per_vlan otherwise.
# The default is per_vlan until the JSON readers have been checked against real
# EOS and NX-OS output (see docs/WORKFLOWS.md). discovery_passes > 1 always reads
# whole tables, because samples need them.
discovery_endpoint_collection: per_vlan
discovery_bulk_min_vlans: 5
# Samples of the endpoint tables (whole tables), discovery_pass_interval seconds
# apart. A host that is quiet during one sample can show up in another; each
# endpoint records how many samples saw it, and one missing from some is
# flagged intermittent. Keep passes x interval under the MAC aging time to
# catch hosts that talk rarely, or above it to see which ones come and go.
discovery_passes: 1
discovery_pass_interval: 120
# Before reading the tables, ping every address in each legacy SVI subnet from
# one SVI owner, so silent hosts answer ARP and refresh the MAC tables on the
# path to them. This sends traffic to every address: opt in per run, and tell
# security operations first. At most discovery_arp_refresh_max_hosts pings per
# switch; larger subnets are skipped and named in the report.
discovery_arp_refresh: false
discovery_arp_refresh_max_hosts: 1024
# Read static MAC entries too (show mac address-table vlan N), so endpoints
# with configured MACs are not missed. The switch's own MACs are left out.
discovery_include_static_macs: true
# Read IPv6 neighbors on SVIs that have IPv6 addresses.
discovery_collect_ipv6: true

# Collect static routes + BGP as first-class L3 discovery (EOS/NXOS/IOS).
# Visibility only - never prune actions (especially default VRF / shared VRF).
discovery_collect_prune_context: true
discovery_write_prune_plan: true
discovery_write_device_prune_plans: true

# EOS commit-timer used in the prune report session text (not applied).
prune_commit_timer: "00:20:00"

# Platform policy on main: NXOS (legacy source) + EOS (target) are first-class.
# IOS discovery code remains in-tree for reuse but is disabled by default.
# Re-enable with -e discovery_enable_ios=true, or check out archive/ios-discovery /
# tag archive/multi-os-ios-nxos-eos-2026-08. See docs/OS_SUPPORT.md.
discovery_enable_ios: false

# Legacy per-device JSON reports (disabled by default).
discovery_write_per_host_json: false

# Whether to capture a device configuration backup before discovery.
vlan_discovery_backup_enabled: false
