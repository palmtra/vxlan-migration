---
# -----------------------------------------------------------------------------
# vlan_discovery defaults
# -----------------------------------------------------------------------------

discovery_reports_dir: "{{ reports_dir | default(playbook_dir | regex_replace('/playbooks(/core|/advanced)?$', '') ~ '/reports') }}"

# VLAN-centric reports (primary output format).
discovery_write_vlan_reports: true
discovery_write_csv: true
discovery_write_markdown: true
discovery_write_json: true
discovery_write_yaml: true
discovery_write_vlan_db_snippet: true

# Collect EOS static routes + BGP neighbors and emit retain-aware prune_plan
# candidates on discovery reports. Never applies deletes.
discovery_collect_prune_context: true
discovery_write_prune_plan: true
discovery_write_device_prune_plans: true

# Legacy per-device JSON reports (disabled by default).
discovery_write_per_host_json: false

# Whether to capture a device configuration backup before discovery.
vlan_discovery_backup_enabled: false
