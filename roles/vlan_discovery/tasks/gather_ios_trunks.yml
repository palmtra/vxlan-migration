---
# -----------------------------------------------------------------------------
# IOS-XE - trunk interface names for classifying show vlan id Ports column
# -----------------------------------------------------------------------------

- name: IOS - show interfaces trunk
  ansible.netcommon.cli_command:
    command: show interfaces trunk
  register: _ios_trunk_show
  check_mode: false
  changed_when: false
  failed_when: false

- name: IOS - cache trunk interface names
  ansible.builtin.set_fact:
    _trunk_interface_names: "{{ _ios_trunk_show.stdout | default('') | trunk_interface_names('ios') }}"
    _trunk_exempt_interface_names: []
  check_mode: false

- name: IOS - default empty trunk interface lists
  ansible.builtin.set_fact:
    _trunk_interface_names: []
    _trunk_exempt_interface_names: []
  when: _trunk_interface_names is not defined
