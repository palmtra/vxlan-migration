---
# -----------------------------------------------------------------------------
# Cisco NXOS state gathering - one targeted query per VLAN in _effective_vlans
# -----------------------------------------------------------------------------

- name: NXOS - initialize per-VLAN discovery results
  ansible.builtin.set_fact:
    _nxos_per_vlan_results: []
    _nxos_static_routes: []
    _nxos_bgp_neighbors: []
    _nxos_bgp_vlan_blocks: []
    _nxos_bgp_vrfs: []
    _nxos_bgp_as: ""
    _nxos_ip_route_raw: ""
    _nxos_bgp_raw: ""

- name: NXOS - collect trunk interface names for port classification
  ansible.builtin.include_tasks: gather_nxos_trunks.yml

- name: NXOS - targeted discovery per VLAN
  ansible.builtin.include_tasks: gather_nxos_vlan.yml
  loop: "{{ _effective_vlans }}"
  loop_control:
    loop_var: _disc_vlan
    label: "{{ _disc_vlan.id }}"

- name: NXOS - collect L3 discovery context (statics + BGP)
  ansible.builtin.include_tasks: gather_nxos_l3_context.yml
  when: discovery_collect_prune_context | default(true) | bool

- name: NXOS - build retain-aware prune plan candidates (VLAN/SVI/trunk)
  ansible.builtin.set_fact:
    _nxos_prune_plan: "{{ inventory_hostname | string | build_device_prune_plan(_pp_vlans, _pp_retain, _pp_statics, _pp_bgp, none, prune_commit_timer | default('00:10:00')) }}"
  vars:
    _pp_vlans: "{{ _nxos_per_vlan_results | default([]) }}"
    _pp_retain: "{{ hostvars['localhost']['_prune_retain'] | default(discovery_prune_retain | default({})) }}"
    _pp_statics: "{{ _nxos_static_routes | default([]) }}"
    _pp_bgp: "{{ _nxos_bgp_neighbors | default([]) }}"
  when: discovery_write_prune_plan | default(true) | bool

- name: NXOS - default empty prune plan when disabled
  ansible.builtin.set_fact:
    _nxos_prune_plan: {}
  when: not (discovery_write_prune_plan | default(true) | bool)

- name: NXOS - assemble discovery fact
  ansible.builtin.set_fact:
    _vlan_discovery:
      hostname: "{{ inventory_hostname }}"
      data_center: "{{ data_center | default('unknown') }}"
      os_family: "{{ network_os_family }}"
      timestamp: "{{ ansible_date_time.iso8601 }}"
      static_routes: "{{ _nxos_static_routes | default([]) }}"
      bgp_neighbors: "{{ _nxos_bgp_neighbors | default([]) }}"
      bgp_vlan_blocks: "{{ _nxos_bgp_vlan_blocks | default([]) }}"
      bgp_vrfs: "{{ _nxos_bgp_vrfs | default([]) }}"
      bgp_as: "{{ _nxos_bgp_as | default('') }}"
      ip_route_raw: "{{ _nxos_ip_route_raw | default('') }}"
      bgp_raw: "{{ _nxos_bgp_raw | default('') }}"
      prune_plan: "{{ _nxos_prune_plan | default({}) }}"
      per_vlan: "{{ _nxos_per_vlan_results | default([]) }}"
