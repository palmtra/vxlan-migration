---
# -----------------------------------------------------------------------------
# Cisco NXOS state gathering
# -----------------------------------------------------------------------------

- name: NXOS — show vlan brief
  ansible.netcommon.cli_command:
    command: show vlan brief
  register: _nxos_show_vlan
  check_mode: false
  changed_when: false
  failed_when: false

- name: NXOS — show SVIs
  ansible.netcommon.cli_command:
    command: show ip interface brief | include Vlan
  register: _nxos_show_svi
  check_mode: false
  changed_when: false
  failed_when: false

- name: NXOS — show trunk interfaces
  ansible.netcommon.cli_command:
    command: show interface trunk
  register: _nxos_show_trunk
  check_mode: false
  changed_when: false
  failed_when: false

- name: NXOS — show VXLAN VNIs
  ansible.netcommon.cli_command:
    command: show nve vni
  register: _nxos_show_vxlan
  check_mode: false
  changed_when: false
  failed_when: false

- name: NXOS — show MAC address table for target VLANs
  ansible.netcommon.cli_command:
    command: "show mac address-table vlan {{ item }}"
  loop: "{{ _effective_vlans | map(attribute='id') | list }}"
  register: _nxos_mac_table
  check_mode: false
  changed_when: false
  failed_when: false
  loop_control:
    label: "{{ item }}"

- name: NXOS — show spanning-tree for target VLANs
  ansible.netcommon.cli_command:
    command: "show spanning-tree vlan {{ item }}"
  loop: "{{ _effective_vlans | map(attribute='id') | list }}"
  register: _nxos_stp
  check_mode: false
  changed_when: false
  failed_when: false
  loop_control:
    label: "{{ item }}"

- name: NXOS — show ARP table for target VRF
  ansible.netcommon.cli_command:
    command: "show ip arp vrf {{ target_vrf | default('default') }}"
  register: _nxos_arp
  check_mode: false
  changed_when: false
  failed_when: false

- name: NXOS — assemble discovery fact
  ansible.builtin.set_fact:
    _vlan_discovery:
      hostname: "{{ inventory_hostname }}"
      data_center: "{{ data_center | default('unknown') }}"
      os_family: "{{ network_os_family }}"
      timestamp: "{{ ansible_date_time.iso8601 }}"
      vlans_raw: "{{ _nxos_show_vlan.stdout | default('') }}"
      svi_raw: "{{ _nxos_show_svi.stdout | default('') }}"
      trunks_raw: "{{ _nxos_show_trunk.stdout | default('') }}"
      vxlan_raw: "{{ _nxos_show_vxlan.stdout | default('') }}"
      mac_table_raw: "{{ _nxos_mac_table.results | default([]) | map(attribute='stdout') | reject('undefined') | list }}"
      stp_raw: "{{ _nxos_stp.results | default([]) | map(attribute='stdout') | reject('undefined') | list }}"
      arp_raw: "{{ _nxos_arp.stdout | default('') }}"
      per_vlan: "{{ _effective_vlans | map('extract_vlan_discovery', {
        'vlan_output': _nxos_show_vlan.stdout | default(''),
        'svi_output': _nxos_show_svi.stdout | default(''),
        'trunk_output': _nxos_show_trunk.stdout | default(''),
        'mac_outputs': _nxos_mac_table.results | default([]),
        'stp_outputs': _nxos_stp.results | default([]),
        'arp_output': _nxos_arp.stdout | default(''),
        'target_vrf': target_vrf | default('')
      }) | list }}"
