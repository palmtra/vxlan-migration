---
# -----------------------------------------------------------------------------
# EOS - trunk interface names + MLAG peer-link exemption (mlagpeer)
# -----------------------------------------------------------------------------

- name: EOS - show interfaces trunk
  ansible.netcommon.cli_command:
    command: show interfaces trunk
  register: _eos_trunk_show
  check_mode: false
  changed_when: false
  failed_when: false

- name: EOS - parse trunk interface list
  ansible.builtin.set_fact:
    _eos_trunk_summaries: "{{ _eos_trunk_show.stdout | default('') | parse_trunk_interfaces('eos') }}"
  check_mode: false

- name: EOS - fetch running-config for trunk maintenance exemption check
  ansible.netcommon.cli_command:
    command: "show running-config interface {{ item.interface }}"
  register: _eos_trunk_run_results
  loop: "{{ _eos_trunk_summaries | default([]) }}"
  loop_control:
    label: "{{ item.interface }}"
  check_mode: false
  changed_when: false
  failed_when: false

- name: EOS - cache trunk interface names
  ansible.builtin.set_fact:
    _trunk_interface_names: "{{ _eos_trunk_summaries | default([]) | map(attribute='interface') | list }}"
    _trunk_exempt_interface_names: "{{ _eos_trunk_run_results.results | default([]) | build_trunk_exempt_interface_names('eos') }}"
  check_mode: false

- name: EOS - default empty trunk interface lists
  ansible.builtin.set_fact:
    _trunk_interface_names: []
    _trunk_exempt_interface_names: []
  when: _trunk_interface_names is not defined
