---
# -----------------------------------------------------------------------------
# Arista EOS state gathering - one targeted query per VLAN in _effective_vlans
# -----------------------------------------------------------------------------

- name: EOS - initialize per-VLAN discovery results
  ansible.builtin.set_fact:
    _eos_per_vlan_results: []
    _eos_static_routes: []
    _eos_bgp_neighbors: []
    _eos_bgp_vlan_blocks: []
    _eos_bgp_vrfs: []
    _eos_bgp_as: ""
    _eos_router_id: ""
    _eos_loopback0: ""
    _eos_loopback1: ""
    _eos_ip_route_raw: ""
    _eos_bgp_raw: ""

- name: EOS - collect trunk interface names for port classification
  ansible.builtin.include_tasks: gather_eos_trunks.yml

- name: EOS - targeted discovery per VLAN
  ansible.builtin.include_tasks: gather_eos_vlan.yml
  loop: "{{ _effective_vlans }}"
  loop_control:
    loop_var: _disc_vlan
    label: "{{ _disc_vlan.id }}"

- name: EOS - show VXLAN vlan-to-vni mappings (reference)
  ansible.netcommon.cli_command:
    command: show vxlan vlan-to-vni
  register: _eos_show_vxlan
  check_mode: false
  changed_when: false
  failed_when: false

- name: EOS - collect L3 discovery context (statics + BGP)
  ansible.builtin.include_tasks: gather_eos_prune_context.yml
  when: discovery_collect_prune_context | default(true) | bool

- name: EOS - show Loopback0 address
  ansible.netcommon.cli_command:
    command: show ip interface Loopback0
  register: _eos_loopback0_show
  check_mode: false
  changed_when: false
  failed_when: false

- name: EOS - show Loopback1 address
  ansible.netcommon.cli_command:
    command: show ip interface Loopback1
  register: _eos_loopback1_show
  check_mode: false
  changed_when: false
  failed_when: false

- name: EOS - record Loopback0 and Loopback1 addresses
  ansible.builtin.set_fact:
    _eos_loopback0: "{{ _eos_loopback0_show.stdout | default('') | parse_interface_ipv4 }}"
    _eos_loopback1: "{{ _eos_loopback1_show.stdout | default('') | parse_interface_ipv4 }}"

- name: EOS - show BGP summary JSON for the local ASN
  ansible.netcommon.cli_command:
    command: show ip bgp summary | json
  register: _eos_bgp_summary_json
  check_mode: false
  changed_when: false
  failed_when: false

- name: EOS - show the router bgp line
  ansible.netcommon.cli_command:
    command: show running-config | include ^router bgp
  register: _eos_bgp_router_line
  check_mode: false
  changed_when: false
  failed_when: false

- name: EOS - parse BGP summary JSON and the router bgp line
  ansible.builtin.set_fact:
    _eos_bgp_summary_parsed: "{{ _eos_bgp_summary_json.stdout | default('') | parse_bgp_summary }}"
    _eos_bgp_router_parsed: "{{ _eos_bgp_router_line.stdout | default('') | parse_bgp_context }}"

- name: EOS - use the JSON local ASN when the config section missed it
  ansible.builtin.set_fact:
    _eos_bgp_as: "{{ _eos_bgp_summary_parsed.bgp_as }}"
  when:
    - _eos_bgp_as | default('') | string | length == 0
    - _eos_bgp_summary_parsed.bgp_as | default('') | length > 0

- name: EOS - use the JSON router-id when the config section missed it
  ansible.builtin.set_fact:
    _eos_router_id: "{{ _eos_bgp_summary_parsed.router_id }}"
  when:
    - _eos_router_id | default('') | string | length == 0
    - _eos_bgp_summary_parsed.router_id | default('') | length > 0

- name: EOS - use the router bgp line when JSON had no ASN
  ansible.builtin.set_fact:
    _eos_bgp_as: "{{ _eos_bgp_router_parsed.bgp_as }}"
  when:
    - _eos_bgp_as | default('') | string | length == 0
    - _eos_bgp_router_parsed.bgp_as | default('') | length > 0

- name: EOS - build human-review prune plan (trunk / SVI / VLAN)
  ansible.builtin.set_fact:
    _eos_prune_plan: "{{ inventory_hostname | string | build_device_prune_plan(_pp_vlans, _pp_retain, _pp_statics, _pp_bgp, none, prune_commit_timer | default('00:10:00')) }}"
  vars:
    _pp_vlans: "{{ _eos_per_vlan_results | default([]) }}"
    _pp_retain: "{{ hostvars['localhost']['_prune_retain'] | default(discovery_prune_retain | default({})) }}"
    _pp_statics: "{{ _eos_static_routes | default([]) }}"
    _pp_bgp: "{{ _eos_bgp_neighbors | default([]) }}"
  when: discovery_write_prune_plan | default(true) | bool

- name: EOS - default empty prune plan when disabled
  ansible.builtin.set_fact:
    _eos_prune_plan: {}
  when: not (discovery_write_prune_plan | default(true) | bool)

- name: EOS - assemble discovery fact
  ansible.builtin.set_fact:
    _vlan_discovery:
      hostname: "{{ inventory_hostname }}"
      data_center: "{{ data_center | default('unknown') }}"
      os_family: "{{ network_os_family }}"
      timestamp: "{{ ansible_date_time.iso8601 }}"
      vxlan_raw: "{{ _eos_show_vxlan.stdout | default('') }}"
      static_routes: "{{ _eos_static_routes | default([]) }}"
      bgp_neighbors: "{{ _eos_bgp_neighbors | default([]) }}"
      bgp_vlan_blocks: "{{ _eos_bgp_vlan_blocks | default([]) }}"
      bgp_vrfs: "{{ _eos_bgp_vrfs | default([]) }}"
      bgp_as: "{{ _eos_bgp_as | default('') }}"
      router_id: "{{ _eos_router_id | default('') }}"
      loopback0: "{{ _eos_loopback0 | default('') }}"
      loopback1: "{{ _eos_loopback1 | default('') }}"
      ip_route_raw: "{{ _eos_ip_route_raw | default('') }}"
      bgp_raw: "{{ _eos_bgp_raw | default('') }}"
      prune_plan: "{{ _eos_prune_plan | default({}) }}"
      per_vlan: "{{ _eos_per_vlan_results | default([]) }}"
