---
# -----------------------------------------------------------------------------
# Arista EOS state gathering
# -----------------------------------------------------------------------------

- name: EOS — show vlan
  ansible.netcommon.cli_command:
    command: show vlan
  register: _eos_show_vlan
  check_mode: false
  changed_when: false
  failed_when: false

- name: EOS — show SVIs
  ansible.netcommon.cli_command:
    command: show ip interface brief | include Vlan
  register: _eos_show_svi
  check_mode: false
  changed_when: false
  failed_when: false

- name: EOS — show switchport / trunk info
  ansible.netcommon.cli_command:
    command: show interfaces switchport
  register: _eos_show_switchport
  check_mode: false
  changed_when: false
  failed_when: false

- name: EOS — show VXLAN vlan-to-vni mappings
  ansible.netcommon.cli_command:
    command: show vxlan vlan-to-vni
  register: _eos_show_vxlan
  check_mode: false
  changed_when: false
  failed_when: false

- name: EOS — show MAC address table for target VLANs
  ansible.netcommon.cli_command:
    command: "show mac address-table vlan {{ item }}"
  loop: "{{ _effective_vlans | map(attribute='id') | list }}"
  register: _eos_mac_table
  check_mode: false
  changed_when: false
  failed_when: false
  loop_control:
    label: "{{ item }}"

- name: EOS — show spanning-tree for target VLANs
  ansible.netcommon.cli_command:
    command: "show spanning-tree vlan {{ item }}"
  loop: "{{ _effective_vlans | map(attribute='id') | list }}"
  register: _eos_stp
  check_mode: false
  changed_when: false
  failed_when: false
  loop_control:
    label: "{{ item }}"

- name: EOS — show ARP table for target VRF
  ansible.netcommon.cli_command:
    command: "show ip arp vrf {{ target_vrf | default('default') }}"
  register: _eos_arp
  check_mode: false
  changed_when: false
  failed_when: false

- name: EOS — assemble discovery fact
  ansible.builtin.set_fact:
    _vlan_discovery:
      hostname: "{{ inventory_hostname }}"
      data_center: "{{ data_center | default('unknown') }}"
      os_family: "{{ network_os_family }}"
      timestamp: "{{ ansible_date_time.iso8601 }}"
      vlans_raw: "{{ _eos_show_vlan.stdout | default('') }}"
      svi_raw: "{{ _eos_show_svi.stdout | default('') }}"
      trunks_raw: "{{ _eos_show_switchport.stdout | default('') }}"
      vxlan_raw: "{{ _eos_show_vxlan.stdout | default('') }}"
      mac_table_raw: "{{ _eos_mac_table.results | default([]) | map(attribute='stdout') | reject('undefined') | list }}"
      stp_raw: "{{ _eos_stp.results | default([]) | map(attribute='stdout') | reject('undefined') | list }}"
      arp_raw: "{{ _eos_arp.stdout | default('') }}"
      per_vlan: "{{ _effective_vlans | map('extract_vlan_discovery', {
        'vlan_output': _eos_show_vlan.stdout | default(''),
        'svi_output': _eos_show_svi.stdout | default(''),
        'trunk_output': _eos_show_switchport.stdout | default(''),
        'mac_outputs': _eos_mac_table.results | default([]),
        'stp_outputs': _eos_stp.results | default([]),
        'arp_output': _eos_arp.stdout | default(''),
        'target_vrf': target_vrf | default('')
      }) | list }}"
