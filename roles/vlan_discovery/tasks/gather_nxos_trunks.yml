---
# -----------------------------------------------------------------------------
# NXOS - trunk interface names + vPC peer-link exemption
# -----------------------------------------------------------------------------

- name: NXOS - show interfaces trunk
  ansible.netcommon.cli_command:
    command: show interface trunk
  register: _nxos_trunk_show
  check_mode: false
  changed_when: false
  failed_when: false

- name: NXOS - parse trunk interface list
  ansible.builtin.set_fact:
    _nxos_trunk_summaries: "{{ _nxos_trunk_show.stdout | default('') | parse_trunk_interfaces('nxos') }}"
  check_mode: false

- name: NXOS - fetch running-config for trunk maintenance exemption check
  ansible.netcommon.cli_command:
    command: "show running-config interface {{ item.interface }}"
  register: _nxos_trunk_run_results
  loop: "{{ _nxos_trunk_summaries | default([]) }}"
  loop_control:
    label: "{{ item.interface }}"
  check_mode: false
  changed_when: false
  failed_when: false

- name: NXOS - cache trunk interface names
  ansible.builtin.set_fact:
    _trunk_interface_names: "{{ _nxos_trunk_summaries | default([]) | map(attribute='interface') | list }}"
    _trunk_exempt_interface_names: "{{ _nxos_trunk_run_results.results | default([]) | build_trunk_exempt_interface_names('nxos') }}"
  check_mode: false

- name: NXOS - default empty trunk interface lists
  ansible.builtin.set_fact:
    _trunk_interface_names: []
    _trunk_exempt_interface_names: []
  when: _trunk_interface_names is not defined
