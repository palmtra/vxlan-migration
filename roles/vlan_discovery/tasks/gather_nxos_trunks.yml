---
# -----------------------------------------------------------------------------
# NXOS — collect trunk interface running-config snippets (once per host)
# -----------------------------------------------------------------------------

- name: NXOS — show interfaces trunk
  ansible.netcommon.cli_command:
    command: show interface trunk
  register: _nxos_trunk_show
  check_mode: false
  changed_when: false
  failed_when: false

- name: NXOS — parse trunk interface list
  ansible.builtin.set_fact:
    _nxos_trunk_summaries: "{{ _nxos_trunk_show.stdout | default('') | parse_trunk_interfaces('nxos') }}"
  check_mode: false

- name: NXOS — fetch running-config for each trunk interface
  ansible.netcommon.cli_command:
    command: "show running-config interface {{ item.interface }}"
  register: _nxos_trunk_run_results
  loop: "{{ _nxos_trunk_summaries | default([]) }}"
  loop_control:
    label: "{{ item.interface }}"
  check_mode: false
  changed_when: false
  failed_when: false

- name: NXOS — build trunk interface config index
  ansible.builtin.set_fact:
    _trunk_interface_configs: "{{ _trunk_interface_configs | default([]) + [_trunk_entry] }}"
  loop: "{{ _nxos_trunk_run_results.results | default([]) }}"
  vars:
    _summary: "{{ (_nxos_trunk_summaries | selectattr('interface', 'equalto', item.item.interface) | first) | default({}) }}"
    _trunk_entry:
      interface: "{{ item.item.interface }}"
      allowed_summary: "{{ _summary.allowed_summary | default('') }}"
      config: "{{ item.stdout | default('') }}"
  when: item.stdout is defined
  check_mode: false

- name: NXOS — default empty trunk interface config index
  ansible.builtin.set_fact:
    _trunk_interface_configs: []
  when: _trunk_interface_configs is not defined
