---
# -----------------------------------------------------------------------------
# Cisco IOS/IOS-XE - targeted per-VLAN commands (one VLAN per include)
# -----------------------------------------------------------------------------

- name: "IOS - show vlan id {{ _disc_vlan.id }}"
  ansible.netcommon.cli_command:
    command: "show vlan id {{ _disc_vlan.id }}"
  register: _ios_vlan_id_show
  check_mode: false
  changed_when: false
  failed_when: false

- name: "IOS - show running-config interface vlan {{ _disc_vlan.id }}"
  ansible.netcommon.cli_command:
    command: "show running-config interface vlan {{ _disc_vlan.id }}"
  register: _ios_svi_show
  check_mode: false
  changed_when: false
  failed_when: false

- name: "IOS - derive SVI VRF for VLAN {{ _disc_vlan.id }}"
  ansible.builtin.set_fact:
    _disc_svi_present: "{{ _ios_svi_show.stdout | default('') | svi_command_indicates_present(_disc_vlan.id) }}"
    _disc_svi_vrf: "{{ _ios_svi_show.stdout | default('') | parse_svi_vrf('ios') }}"

- name: "IOS - show ip arp for SVI Vlan{{ _disc_vlan.id }} in VRF {{ _disc_svi_vrf }}"
  ansible.netcommon.cli_command:
    command: "{{ _disc_arp_command }}"
  register: _ios_arp_show
  vars:
    _disc_arp_command: "{{ 'ios' | arp_discovery_command(_disc_vlan.id, _disc_svi_vrf, _disc_svi_present) }}"
  when:
    - _disc_svi_present | bool
    - _disc_arp_command | length > 0
  check_mode: false
  changed_when: false
  failed_when: false

- name: "IOS - default empty ARP output for VLAN {{ _disc_vlan.id }}"
  ansible.builtin.set_fact:
    _ios_arp_show:
      stdout: ""
  when: _ios_arp_show is not defined

- name: "IOS - show dynamic MAC table for VLAN {{ _disc_vlan.id }}"
  ansible.netcommon.cli_command:
    command: "{{ 'ios' | mac_discovery_command(_disc_vlan.id) }}"
  register: _ios_mac_show
  check_mode: false
  changed_when: false
  failed_when: false

- name: "IOS - parse VLAN ports and MAC table for interface-config fetch"
  ansible.builtin.set_fact:
    _ios_member_run_results:
      results: []
    _ios_vlan_ports: "{{ _ios_vlan_id_show.stdout | default('') | parse_vlan_id_ports(_disc_vlan.id, 'ios', _trunk_interface_names | default([]), _trunk_exempt_interface_names | default([])) }}"
    _ios_mac_preview: "{{ _ios_mac_show.stdout | default('') | parse_mac_address_table(_disc_vlan.id) }}"
  check_mode: false

- name: "IOS - list VLAN member ports missing interface config"
  ansible.builtin.set_fact:
    _ios_ports_needing_config: "{{ _ios_vlan_ports.all_ports | default([]) | ports_needing_interface_config(_interface_config_entries | default([]), _ios_mac_preview | default([]), 'ios') }}"
  check_mode: false

- name: "IOS - fetch running-config for remaining VLAN member ports"
  ansible.netcommon.cli_command:
    command: "show running-config interface {{ item }}"
  register: _ios_member_run_results
  loop: "{{ _ios_ports_needing_config }}"
  loop_control:
    label: "{{ item }}"
  when: _ios_ports_needing_config | length > 0
  check_mode: false
  changed_when: false
  failed_when: false

- name: "IOS - default empty member interface configs"
  ansible.builtin.set_fact:
    _ios_member_run_results:
      results: []
  when: _ios_member_run_results is not defined or _ios_member_run_results.results is not defined

- name: "IOS - append discovery record for VLAN {{ _disc_vlan.id }}"
  ansible.builtin.set_fact:
    _ios_per_vlan_results: "{{ _ios_per_vlan_results | default([]) + [_ios_vlan_record] }}"
  vars:
    _ios_vlan_record: "{{ _disc_vlan | extract_vlan_targeted_discovery({
      'platform': 'ios',
      'vlan_id_output': _ios_vlan_id_show.stdout | default(''),
      'svi_output': _ios_svi_show.stdout | default(''),
      'mac_output': _ios_mac_show.stdout | default(''),
      'arp_output': _ios_arp_show.stdout | default(''),
      'trunk_interface_names': _trunk_interface_names | default([]),
      'exempt_trunk_interface_names': _trunk_exempt_interface_names | default([]),
      'trunk_summaries': _ios_trunk_summaries | default([]),
      'interface_configs': (_interface_config_entries | default([])) + (_ios_member_run_results.results | default([]) | interface_config_entries_from_cli_results('ios')),
      'switch_hostnames': ansible_play_hosts,
      'target_vrf': target_vrf | default('')
    }) }}"
