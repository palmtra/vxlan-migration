---
# -----------------------------------------------------------------------------
# vlan_discovery
# -----------------------------------------------------------------------------
# Gathers current VLAN/SVI/trunk/VXLAN state per device and writes
# timestamped per-host JSON and combined CSV/Markdown reports under
# reports/<dc>/<device>/ and reports/<scope>/ respectively.
# -----------------------------------------------------------------------------

- name: Set a millisecond timestamp for this discovery run
  ansible.builtin.set_fact:
    _report_timestamp_ms: "{{ hostvars[ansible_play_hosts[0]]._report_timestamp_ms | default(lookup('pipe', 'date +%Y%m%d_%H%M%S_%3N')) }}"
    _report_scope: "{{ ansible_play_hosts | map('extract', hostvars) | map(attribute='data_center') | reject('undefined') | unique | list | join('_') | default('unknown', true) }}"
  delegate_to: localhost
  become: false
  check_mode: false

- name: Ensure per-device report directory exists
  ansible.builtin.file:
    path: "{{ discovery_reports_dir }}/{{ data_center | default('unknown') }}/{{ inventory_hostname }}"
    state: directory
    mode: '0755'
    recurse: true
  delegate_to: localhost
  become: false
  check_mode: false

- name: Include EOS discovery tasks
  ansible.builtin.include_tasks: gather_eos.yml
  when: network_os_family == 'eos'

- name: Include NXOS discovery tasks
  ansible.builtin.include_tasks: gather_nxos.yml
  when: network_os_family == 'nxos'

- name: Include IOS discovery tasks
  ansible.builtin.include_tasks: gather_ios.yml
  when: network_os_family == 'ios'

- name: Write per-host JSON report
  ansible.builtin.template:
    src: host_report.json.j2
    dest: "{{ discovery_reports_dir }}/{{ data_center | default('unknown') }}/{{ inventory_hostname }}/{{ inventory_hostname }}_vlan_state_{{ _report_timestamp_ms }}.json"
    mode: '0644'
  delegate_to: localhost
  become: false
  when: discovery_write_json | bool

- name: Ensure combined report directory exists
  ansible.builtin.file:
    path: "{{ discovery_reports_dir }}/{{ _report_scope }}"
    state: directory
    mode: '0755'
    recurse: true
  delegate_to: localhost
  become: false
  run_once: true
  check_mode: false

- name: Write combined CSV report
  ansible.builtin.template:
    src: combined_report.csv.j2
    dest: "{{ discovery_reports_dir }}/{{ _report_scope }}/combined_vlan_state_{{ _report_timestamp_ms }}.csv"
    mode: '0644'
  delegate_to: localhost
  become: false
  run_once: true
  when: discovery_write_csv | bool

- name: Write Markdown discovery report
  ansible.builtin.template:
    src: discovery_report.md.j2
    dest: "{{ discovery_reports_dir }}/{{ _report_scope }}/discovery_report_{{ _report_timestamp_ms }}.md"
    mode: '0644'
  delegate_to: localhost
  become: false
  run_once: true
  when: discovery_write_markdown | bool
