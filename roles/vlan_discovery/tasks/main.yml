---
# -----------------------------------------------------------------------------
# vlan_discovery
# -----------------------------------------------------------------------------
# Gathers current VLAN/SVI/trunk/VXLAN state per device and writes:
#   reports/<dc>/<vlan_name>/<vlan>_discovery_<ts>.*  (compute MACs / endpoints)
#   reports/<dc>/<vlan_name>/<vlan>_prune_<ts>.*      (EOS session / NXOS checkpoint)
# -----------------------------------------------------------------------------

- name: Set a millisecond timestamp for this discovery run
  ansible.builtin.set_fact:
    _report_timestamp_ms: "{{ hostvars[ansible_play_hosts[0]]._report_timestamp_ms | default(lookup('pipe', 'date +%Y%m%d_%H%M%S_%3N')) }}"
  delegate_to: localhost
  become: false
  check_mode: false

- name: Include EOS discovery tasks
  ansible.builtin.include_tasks: gather_eos.yml
  when: network_os_family == 'eos'

- name: Include NXOS discovery tasks
  ansible.builtin.include_tasks: gather_nxos.yml
  when: network_os_family == 'nxos'

- name: Include IOS discovery tasks (parked on main - see docs/OS_SUPPORT.md)
  ansible.builtin.include_tasks: gather_ios.yml
  when:
    - network_os_family == 'ios'
    - discovery_enable_ios | default(false) | bool

- name: Skip parked IOS hosts when discovery_enable_ios is false
  ansible.builtin.debug:
    msg: >-
      Skipping IOS discovery for {{ inventory_hostname }}.
      Main develops NXOS→EOS only. Set discovery_enable_ios=true or use
      archive/ios-discovery / tag archive/multi-os-ios-nxos-eos-2026-08.
  when:
    - network_os_family == 'ios'
    - not (discovery_enable_ios | default(false) | bool)

- name: Write legacy per-host JSON report
  ansible.builtin.template:
    src: host_report.json.j2
    dest: "{{ discovery_reports_dir }}/{{ hostvars['localhost']['_vlan_db_data_center'] }}/{{ inventory_hostname }}/{{ inventory_hostname }}_vlan_state_{{ _report_timestamp_ms }}.json"
    mode: '0644'
  delegate_to: localhost
  become: false
  when:
    - discovery_write_per_host_json | bool
    - discovery_write_vlan_reports | bool

- name: Build VLAN-centric discovery reports
  ansible.builtin.set_fact:
    _vlan_discovery_reports: "{{ _effective_vlans_for_reports | build_vlan_discovery_reports(ansible_play_hosts, hostvars) | map('combine', {'data_center': _report_data_center}) | list }}"
  vars:
    _effective_vlans_for_reports: "{{ hostvars['localhost']['_effective_vlans'] | default(_effective_vlans | default([])) }}"
    _report_data_center: "{{ hostvars['localhost']['_vlan_db_data_center'] }}"
  delegate_to: localhost
  become: false
  run_once: true
  check_mode: false

- name: Apply the discovered VLAN name and previous-gateway description
  ansible.builtin.set_fact:
    _target_vlan_record: "{{ hostvars['localhost']['_target_vlan_record'] | merge_discovered_labels(_vlan_discovery_reports | default([])) }}"
  delegate_to: localhost
  delegate_facts: true
  become: false
  run_once: true
  when:
    - hostvars['localhost']['_target_vlan_record'] | default({}) | length > 0
    - _vlan_discovery_reports | default([]) | length > 0

- name: Use a VLAN name supplied for this run when discovery did not find one
  ansible.builtin.set_fact:
    _target_vlan_record: "{{ hostvars['localhost']['_target_vlan_record'] | combine({'name': manual_vlan_name, 'vlan_name': manual_vlan_name, '_label_needs_vlan_name': false}) }}"
  delegate_to: localhost
  delegate_facts: true
  become: false
  run_once: true
  when:
    - vlan_prompt_for_labels | default(false) | bool
    - (hostvars['localhost']['_target_vlan_record'] | default({}))._label_needs_vlan_name | default(false) | bool
    - manual_vlan_name | default('') | length > 0

- name: Ask for the VLAN name when discovery did not find one
  ansible.builtin.pause:
    prompt: >-
      VLAN {{ hostvars['localhost']['_target_vlan_record'].id }} has no agreed name from discovery
      {% if hostvars['localhost']['_target_vlan_record']._name_candidates | default([]) | length > 0 %}(saw {{ hostvars['localhost']['_target_vlan_record']._name_candidates | join(', ') }}). {% else %}. {% endif %}Enter the VLAN name to use on the fabric.
  register: _asked_vlan_name
  delegate_to: localhost
  become: false
  run_once: true
  when:
    - vlan_prompt_for_labels | default(false) | bool
    - (hostvars['localhost']['_target_vlan_record'] | default({}))._label_needs_vlan_name | default(false) | bool
    - manual_vlan_name | default('') | length == 0

- name: Store the VLAN name that was asked for
  ansible.builtin.set_fact:
    _target_vlan_record: "{{ hostvars['localhost']['_target_vlan_record'] | combine({'name': _asked_vlan_name.user_input | trim, 'vlan_name': _asked_vlan_name.user_input | trim, '_label_needs_vlan_name': false}) }}"
  delegate_to: localhost
  delegate_facts: true
  become: false
  run_once: true
  when:
    - _asked_vlan_name.user_input | default('') | trim | length > 0

- name: Fail when the VLAN name is still unknown
  ansible.builtin.fail:
    msg: >-
      VLAN {{ hostvars['localhost']['_target_vlan_record'].id }} has no name from discovery.
      Re-run and enter a name, or pass -e manual_vlan_name=.
  run_once: true
  when:
    - vlan_prompt_for_labels | default(false) | bool
    - (hostvars['localhost']['_target_vlan_record'] | default({}))._label_needs_vlan_name | default(false) | bool

- name: Use a gateway description supplied for this run when discovery did not find one
  ansible.builtin.set_fact:
    _target_vlan_record: "{{ hostvars['localhost']['_target_vlan_record'] | combine({'description': manual_svi_description, 'svi_description': manual_svi_description, '_label_needs_svi_description': false}) }}"
  delegate_to: localhost
  delegate_facts: true
  become: false
  run_once: true
  when:
    - vlan_prompt_for_labels | default(false) | bool
    - (hostvars['localhost']['_target_vlan_record'] | default({})).service_type | default('') == 'l3'
    - (hostvars['localhost']['_target_vlan_record'] | default({}))._label_needs_svi_description | default(false) | bool
    - manual_svi_description | default('') | length > 0

- name: Ask for the gateway interface description when discovery did not find one
  ansible.builtin.pause:
    prompt: >-
      VLAN {{ hostvars['localhost']['_target_vlan_record'].id }} has no agreed interface description on the previous gateway
      {% if hostvars['localhost']['_target_vlan_record']._description_candidates | default([]) | length > 0 %}(saw {{ hostvars['localhost']['_target_vlan_record']._description_candidates | join(', ') }}). {% else %}. {% endif %}Enter the description to use on the fabric SVI.
  register: _asked_svi_description
  delegate_to: localhost
  become: false
  run_once: true
  when:
    - vlan_prompt_for_labels | default(false) | bool
    - (hostvars['localhost']['_target_vlan_record'] | default({})).service_type | default('') == 'l3'
    - (hostvars['localhost']['_target_vlan_record'] | default({}))._label_needs_svi_description | default(false) | bool
    - manual_svi_description | default('') | length == 0

- name: Store the gateway description that was asked for
  ansible.builtin.set_fact:
    _target_vlan_record: "{{ hostvars['localhost']['_target_vlan_record'] | combine({'description': _asked_svi_description.user_input | trim, 'svi_description': _asked_svi_description.user_input | trim, '_label_needs_svi_description': false}) }}"
  delegate_to: localhost
  delegate_facts: true
  become: false
  run_once: true
  when:
    - _asked_svi_description.user_input | default('') | trim | length > 0

- name: Fail when the gateway interface description is still unknown
  ansible.builtin.fail:
    msg: >-
      VLAN {{ hostvars['localhost']['_target_vlan_record'].id }} has no interface description from the previous gateway.
      Re-run and enter one, or pass -e manual_svi_description=.
  run_once: true
  when:
    - vlan_prompt_for_labels | default(false) | bool
    - (hostvars['localhost']['_target_vlan_record'] | default({})).service_type | default('') == 'l3'
    - (hostvars['localhost']['_target_vlan_record'] | default({}))._label_needs_svi_description | default(false) | bool

- name: Ensure VLAN report directory exists
  ansible.builtin.file:
    path: "{{ discovery_reports_dir }}/{{ item.data_center | default('unknown') }}/{{ item.vlan_slug }}"
    state: directory
    mode: '0755'
    recurse: true
  delegate_to: localhost
  become: false
  run_once: true
  loop: "{{ _vlan_discovery_reports | default([]) }}"
  loop_control:
    label: "{{ item.vlan_name }}"
  when: discovery_write_vlan_reports | bool

- name: Write VLAN-centric Markdown report
  ansible.builtin.template:
    src: vlan_discovery_report.md.j2
    dest: "{{ discovery_reports_dir }}/{{ report.data_center | default('unknown') }}/{{ report.vlan_slug }}/{{ report.vlan_slug }}_discovery_{{ _report_timestamp_ms }}.md"
    mode: '0644'
  delegate_to: localhost
  become: false
  run_once: true
  loop: "{{ _vlan_discovery_reports | default([]) }}"
  loop_control:
    loop_var: report
    label: "{{ report.vlan_name }}"
  when:
    - discovery_write_vlan_reports | bool
    - discovery_write_markdown | bool

- name: Write VLAN-centric CSV report
  ansible.builtin.template:
    src: vlan_discovery_report.csv.j2
    dest: "{{ discovery_reports_dir }}/{{ report.data_center | default('unknown') }}/{{ report.vlan_slug }}/{{ report.vlan_slug }}_discovery_{{ _report_timestamp_ms }}.csv"
    mode: '0644'
  delegate_to: localhost
  become: false
  run_once: true
  loop: "{{ _vlan_discovery_reports | default([]) }}"
  loop_control:
    loop_var: report
    label: "{{ report.vlan_name }}"
  when:
    - discovery_write_vlan_reports | bool
    - discovery_write_csv | bool

- name: Write VLAN-centric JSON report
  ansible.builtin.template:
    src: vlan_discovery_report.json.j2
    dest: "{{ discovery_reports_dir }}/{{ report.data_center | default('unknown') }}/{{ report.vlan_slug }}/{{ report.vlan_slug }}_discovery_{{ _report_timestamp_ms }}.json"
    mode: '0644'
  delegate_to: localhost
  become: false
  run_once: true
  loop: "{{ _vlan_discovery_reports | default([]) }}"
  loop_control:
    loop_var: report
    label: "{{ report.vlan_name }}"
  when:
    - discovery_write_vlan_reports | bool
    - discovery_write_json | bool

- name: Write VLAN-centric YAML report
  ansible.builtin.template:
    src: vlan_discovery_report.yaml.j2
    dest: "{{ discovery_reports_dir }}/{{ report.data_center | default('unknown') }}/{{ report.vlan_slug }}/{{ report.vlan_slug }}_discovery_{{ _report_timestamp_ms }}.yml"
    mode: '0644'
  delegate_to: localhost
  become: false
  run_once: true
  loop: "{{ _vlan_discovery_reports | default([]) }}"
  loop_control:
    loop_var: report
    label: "{{ report.vlan_name }}"
  when:
    - discovery_write_vlan_reports | bool
    - discovery_write_yaml | bool

- name: Write VLAN DB snippet for pasting into vars/vlans/{{ report.data_center }}.yml
  ansible.builtin.template:
    src: vlan_db_snippet.yml.j2
    dest: "{{ discovery_reports_dir }}/{{ report.data_center | default('unknown') }}/{{ report.vlan_slug }}/{{ report.vlan_id | vlan_db_record_filename(report.vlan_name) }}"
    mode: '0644'
  delegate_to: localhost
  become: false
  run_once: true
  loop: "{{ _vlan_discovery_reports | default([]) }}"
  loop_control:
    loop_var: report
    label: "{{ report.vlan_name }}"
  when:
    - discovery_write_vlan_reports | bool
    - discovery_write_vlan_db_snippet | bool

- name: Write VLAN-centric prune Markdown report
  ansible.builtin.template:
    src: vlan_prune_report.md.j2
    dest: "{{ discovery_reports_dir }}/{{ report.data_center | default('unknown') }}/{{ report.vlan_slug }}/{{ report.vlan_slug }}_prune_{{ _report_timestamp_ms }}.md"
    mode: '0644'
  delegate_to: localhost
  become: false
  run_once: true
  loop: "{{ _vlan_discovery_reports | default([]) }}"
  loop_control:
    loop_var: report
    label: "{{ report.vlan_name }}"
  when:
    - discovery_write_vlan_reports | bool
    - discovery_write_prune_plan | default(true) | bool
    - discovery_write_markdown | bool

- name: Write VLAN-centric prune JSON report
  ansible.builtin.template:
    src: vlan_prune_report.json.j2
    dest: "{{ discovery_reports_dir }}/{{ report.data_center | default('unknown') }}/{{ report.vlan_slug }}/{{ report.vlan_slug }}_prune_{{ _report_timestamp_ms }}.json"
    mode: '0644'
  delegate_to: localhost
  become: false
  run_once: true
  loop: "{{ _vlan_discovery_reports | default([]) }}"
  loop_control:
    loop_var: report
    label: "{{ report.vlan_name }}"
  when:
    - discovery_write_vlan_reports | bool
    - discovery_write_prune_plan | default(true) | bool
    - discovery_write_json | bool

- name: Collect per-device prune plans from discovery facts
  ansible.builtin.set_fact:
    _device_prune_plans: "{{ ansible_play_hosts | map('extract', hostvars, '_vlan_discovery') | selectattr('prune_plan', 'defined') | map(attribute='prune_plan') | selectattr('hostname', 'defined') | list }}"
  delegate_to: localhost
  become: false
  run_once: true
  check_mode: false
  when:
    - discovery_write_prune_plan | default(true) | bool
    - discovery_write_device_prune_plans | default(true) | bool

- name: Ensure device prune plan directory exists
  ansible.builtin.file:
    path: "{{ discovery_reports_dir }}/{{ _report_data_center }}/_prune_plans"
    state: directory
    mode: '0755'
  vars:
    _report_data_center: "{{ hostvars['localhost']['_vlan_db_data_center'] }}"
  delegate_to: localhost
  become: false
  run_once: true
  when:
    - discovery_write_prune_plan | default(true) | bool
    - discovery_write_device_prune_plans | default(true) | bool
    - _device_prune_plans | default([]) | length > 0

- name: Write per-device prune plan JSON candidates
  ansible.builtin.copy:
    content: "{{ item | to_nice_json }}\n"
    dest: "{{ discovery_reports_dir }}/{{ _report_data_center }}/_prune_plans/{{ item.hostname }}_prune_plan_{{ _report_timestamp_ms }}.json"
    mode: '0644'
  vars:
    _report_data_center: "{{ hostvars['localhost']['_vlan_db_data_center'] }}"
  delegate_to: localhost
  become: false
  run_once: true
  loop: "{{ _device_prune_plans | default([]) }}"
  loop_control:
    label: "{{ item.hostname | default('unknown') }}"
  when:
    - discovery_write_prune_plan | default(true) | bool
    - discovery_write_device_prune_plans | default(true) | bool
    - item.hostname | default('') | length > 0

- name: Display VLAN report output paths
  ansible.builtin.debug:
    msg: >-
      Wrote discovery reports under
      {{ discovery_reports_dir }}/{{ item.data_center | default('unknown') }}/{{ item.vlan_slug }}/
      ({{ item.vlan_slug }}_discovery_{{ _report_timestamp_ms }} and
      {{ item.vlan_slug }}_prune_{{ _report_timestamp_ms }})
  delegate_to: localhost
  become: false
  run_once: true
  loop: "{{ _vlan_discovery_reports | default([]) }}"
  loop_control:
    label: "{{ item.vlan_name }}"
  when: discovery_write_vlan_reports | bool
