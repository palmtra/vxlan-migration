---
# -----------------------------------------------------------------------------
# network_common
# -----------------------------------------------------------------------------
# Shared tasks used by discovery and migration playbooks:
#   - reuse VLAN registry loaded by vlan_db (or load per-DC file as fallback)
#   - filter to the VLANs targeted by the current playbook
#   - gather network facts
#   - capture a configuration backup
# -----------------------------------------------------------------------------

- name: Gather date/time facts on the control node
  ansible.builtin.setup:
    gather_subset:
      - date_time
  delegate_to: localhost
  become: false
  run_once: true
  register: _localhost_facts
  check_mode: false
  changed_when: false

- name: Expose date/time facts for report timestamps
  ansible.builtin.set_fact:
    ansible_date_time: "{{ _localhost_facts.ansible_facts.ansible_date_time }}"

- name: Reuse VLAN registry loaded by vlan_db on localhost
  ansible.builtin.set_fact:
    vlan_registry: "{{ hostvars['localhost']['vlan_registry'] }}"
    _effective_vlans: "{{ hostvars['localhost']['_effective_vlans'] }}"
  when:
    - hostvars['localhost']['_effective_vlans'] is defined
    - hostvars['localhost']['vlan_registry'] is defined

- name: Fail when vlan_db did not populate _effective_vlans on localhost
  ansible.builtin.fail:
    msg: >-
      _effective_vlans is not set on localhost. Run roles/vlan_db in a prior play first.
  when:
    - hostvars['localhost']['_effective_vlans'] is not defined
    - _effective_vlans is not defined

- name: Load per-DC VLAN registry when vlan_db was not run
  when:
    - hostvars['localhost']['_effective_vlans'] is not defined
    - _effective_vlans is not defined
  block:
    - name: Resolve data center for standalone VLAN registry load
      ansible.builtin.set_fact:
        _local_dc: "{{ target_data_center | default(manual_data_center, true) | default(data_center, true) | default('', true) | trim }}"

    - name: Fail when data center cannot be determined for VLAN registry load
      ansible.builtin.fail:
        msg: >-
          Could not determine the data center for VLAN registry loading.
          Run the vlan_db role first, or pass target_data_center / manual_data_center,
          or ensure each host defines data_center.
      when: _local_dc | length == 0

    - name: Load per-DC VLAN registry file
      ansible.builtin.include_vars:
        file: "{{ vlan_db_dir | default(playbook_dir ~ '/../vars/vlans') }}/{{ _local_dc }}.yml"
        name: vlan_registry

    - name: Compute effective VLAN list for this run
      ansible.builtin.set_fact:
        _effective_vlans: "{{ vlan_registry.vlans | select_vlans_for_run(hostvars['localhost']['target_vlan_ids'] | default(target_vlan_ids | default([])), target_actions | default([])) }}"

- name: Display VLANs selected for this host
  ansible.builtin.debug:
    msg: "Selected VLANs: {{ _effective_vlans | map(attribute='id') | list }}"

- name: Verify device reachability
  ansible.netcommon.cli_command:
    command: show version
  register: _net_version
  check_mode: false
  changed_when: false

- name: Gather structured network facts
  action: "{{ network_facts_module }}"
  register: _network_facts
  check_mode: false
  changed_when: false

- name: Capture pre-change configuration backup
  ansible.builtin.include_tasks: backup.yml
  when: network_backup_enabled | bool
