---
# -----------------------------------------------------------------------------
# Configuration backup per host
# -----------------------------------------------------------------------------

- name: Ensure backup directory exists
  ansible.builtin.file:
    path: "{{ network_backup_dir }}"
    state: directory
    mode: '0755'
  delegate_to: localhost
  become: false
  check_mode: false

- name: Retrieve running configuration
  ansible.netcommon.cli_command:
    command: show running-config
  register: _running_config
  check_mode: false
  changed_when: false

- name: Write running configuration to timestamped file
  ansible.builtin.copy:
    content: "{{ _running_config.stdout }}"
    dest: "{{ network_backup_dir }}/running-config-{{ ansible_date_time.iso8601_basic }}.txt"
    mode: '0644'
  delegate_to: localhost
  become: false
