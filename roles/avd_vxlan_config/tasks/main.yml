---
# -----------------------------------------------------------------------------
# avd_vxlan_config
# -----------------------------------------------------------------------------
# Generates per-device EOS config for a VLAN-to-VXLAN migration using the
# Arista AVD eos_cli_config_gen role.  This role is intended to run in a play
# targeted at eos_devices; it writes per-device structured configs, invokes AVD
# to render CLI snippets, and optionally pushes them to CVP.
# -----------------------------------------------------------------------------

- name: Look up target VLAN in the local VLAN DB
  ansible.builtin.set_fact:
    _avd_vlan: "{{ hostvars['localhost']['_target_vlan_record'] | default({}) }}"
  delegate_to: localhost
  become: false
  run_once: true

- name: Fail when target VLAN record is not available on localhost
  ansible.builtin.fail:
    msg: >-
      VLAN {{ target_vlan_id }} not found on localhost. Run roles/vlan_db before
      avd_vxlan_config.
  delegate_to: localhost
  become: false
  run_once: true
  when: not _avd_vlan

- name: Fail without an L2 VNI (from the VLAN record or NetBox)
  ansible.builtin.fail:
    msg: >-
      VLAN {{ target_vlan_id }} has no L2 VNI. Set evpn.l2.vni in its record (vars/vlans/), or terminate the
      VLAN on a VXLAN-EVPN L2VPN in NetBox (identifier = VNI) and keep netbox_evpn_lookup on.
  when: not (_avd_vlan.vni | default('') | string | trim is match('^[0-9]+$'))
  delegate_to: localhost
  become: false
  run_once: true

- name: Refuse a multicast BUM group (the fabric uses head-end replication only)
  ansible.builtin.fail:
    msg: >-
      VLAN {{ target_vlan_id }} sets mcast_group {{ _avd_vlan.mcast_group }}.
      The fabric floods BUM with head-end replication (EVPN type-3 flood lists),
      not multicast. Remove mcast_group from the VLAN record.
  when: _avd_vlan.mcast_group | default('') | string | length > 0
  delegate_to: localhost
  become: false
  run_once: true

- name: Fail when a VTEP cannot build the BGP VLAN route distinguisher
  ansible.builtin.fail:
    msg: >-
      VLAN {{ target_vlan_id }} on {{ item }} needs {{ _bgp.missing | join(' and ') }}
      to publish the EVPN VLAN. Discovery did not find that on the switch (or did not run:
      deploy_discovery=false), and the VLAN record has no value for it: add asn and router_id
      (or rd) to its entry under placement.participating_leafs in vars/vlans/.
  loop: "{{ ansible_play_hosts }}"
  vars:
    _vtep_bgp: "{{ hostvars[item] | host_vtep_bgp }}"
    _bgp: "{{ _avd_vlan | bgp_vlan_evpn(item, _vtep_bgp.asn | default(avd_default_bgp_as | default('', true), true), _vtep_bgp.router_id) }}"
  when: _bgp.missing | default([]) | length > 0
  delegate_to: localhost
  become: false
  run_once: true

- name: Render one configlet per VLAN per leaf (Network Provisioning)
  ansible.builtin.include_tasks: configlets.yml
  when: cvp_deploy_method | default('configlets') != 'studios'

- name: Render one configlet per leaf with every VLAN deployed on it (Studios)
  ansible.builtin.include_tasks: studios.yml
  when: cvp_deploy_method | default('configlets') == 'studios'
