---
# -----------------------------------------------------------------------------
# avd_vxlan_config
# -----------------------------------------------------------------------------
# Generates per-device EOS configlets for a VLAN-to-VXLAN migration using the
# Arista AVD eos_cli_config_gen role.  This role is intended to run in a play
# targeted at eos_devices; it writes per-device structured configs, invokes AVD
# to render CLI snippets, and optionally pushes them to CVP.
# -----------------------------------------------------------------------------

- name: Ensure AVD output directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  delegate_to: localhost
  become: false
  run_once: true
  loop:
    - "{{ avd_output_dir }}"
    - "{{ avd_output_dir }}/structured_configs"
    - "{{ avd_output_dir }}/configs"

- name: Resolve Ansible collections search paths
  ansible.builtin.set_fact:
    _avd_collections_paths: "{{ _raw_avd_collections_paths.split(':') if (_raw_avd_collections_paths is string) else _raw_avd_collections_paths }}"
  vars:
    _raw_avd_collections_paths: "{{ lookup('ansible.builtin.config', 'COLLECTIONS_PATHS') }}"
  delegate_to: localhost
  become: false
  run_once: true

- name: Locate installed arista.avd collection manifest
  ansible.builtin.stat:
    path: "{{ item }}/ansible_collections/arista/avd/MANIFEST.json"
  register: _avd_collection_manifest
  delegate_to: localhost
  become: false
  run_once: true
  loop: "{{ _avd_collections_paths }}"

- name: Fail when arista.avd collection is not installed
  ansible.builtin.fail:
    msg: >-
      arista.avd is not installed. From the repo root run:
      ansible-galaxy collection install -r collections/requirements.yml -p collections/
  delegate_to: localhost
  become: false
  run_once: true
  when: _avd_collection_manifest.results | selectattr('stat.exists', 'defined') | selectattr('stat.exists') | list | length == 0

- name: Look up target VLAN in the local VLAN DB
  ansible.builtin.set_fact:
    _avd_vlan: "{{ hostvars['localhost']['_target_vlan_record'] | default({}) }}"
  delegate_to: localhost
  become: false
  run_once: true

- name: Fail when target VLAN record is not available on localhost
  ansible.builtin.fail:
    msg: >-
      VLAN {{ target_vlan_id }} not found on localhost. Run roles/vlan_db before
      avd_vxlan_config.
  delegate_to: localhost
  become: false
  run_once: true
  when: not _avd_vlan

- name: Write per-device AVD structured config files
  ansible.builtin.template:
    src: avd_structured_config.yml.j2
    dest: "{{ avd_output_dir }}/structured_configs/{{ item }}.yml"
    mode: '0644'
  delegate_to: localhost
  become: false
  run_once: true
  loop: "{{ ansible_play_hosts }}"
  vars:
    _target_device: "{{ item }}"
    _is_borderleaf: "{{ item is match(avd_borderleaf_regex) }}"

- name: Render EOS configuration with AVD eos_cli_config_gen
  arista.avd.eos_cli_config_gen:
    structured_config_filename: "{{ avd_output_dir }}/structured_configs/{{ inventory_hostname }}.yml"
    config_filename: "{{ avd_output_dir }}/configs/{{ inventory_hostname }}.cfg"
    read_structured_config_from_file: true
    generate_device_config: true
    generate_device_doc: false
  delegate_to: localhost
  become: false

- name: Read generated EOS configuration files
  ansible.builtin.slurp:
    src: "{{ avd_output_dir }}/configs/{{ item }}.cfg"
  register: _avd_config_files
  delegate_to: localhost
  become: false
  run_once: true
  loop: "{{ ansible_play_hosts }}"

- name: Build CVP configlet map
  ansible.builtin.set_fact:
    _avd_configlets: "{{ _avd_configlets | default({}) | combine({ item.item ~ '_vlan' ~ target_vlan_id: item.content | b64decode }) }}"
  delegate_to: localhost
  become: false
  run_once: true
  loop: "{{ _avd_config_files.results }}"

- name: Display generated configlets
  ansible.builtin.debug:
    var: _avd_configlets
  delegate_to: localhost
  become: false
  run_once: true

- name: Enforce explicit approval before any auto-executing CVP change control
  ansible.builtin.fail:
    msg: >-
      cvp_change_control_state is set to '{{ cvp_change_control_state }}' which would
      auto-execute on CVP. Set cvp_change_control_auto_execute_allowed=true and confirm
      the change control has been reviewed before proceeding.
  when:
    - cvp_apply_configlets | bool
    - cvp_change_control_state in ['approve', 'execute', 'approve_and_execute', 'schedule_and_approve']
    - not cvp_change_control_auto_execute_allowed | bool

- name: Apply CVP configlets (only when cvp_apply_configlets is true)
  arista.cvp.cv_configlet_v3:
    cvp_server: "{{ cvp_server }}"
    cvp_token: "{{ cvp_token_value }}"
    configlets: "{{ _avd_configlets }}"
    state: present
  delegate_to: localhost
  become: false
  run_once: true
  when:
    - cvp_apply_configlets | bool
    - cvp_server | length > 0
    - cvp_token | length > 0

- name: Assign CVP configlets to target devices
  arista.cvp.cv_device_v3:
    cvp_server: "{{ cvp_server }}"
    cvp_token: "{{ cvp_token_value }}"
    devices:
      - fqdn: "{{ item }}"
        configlets:
          - "{{ item }}_vlan{{ target_vlan_id }}"
  loop: "{{ ansible_play_hosts }}"
  delegate_to: localhost
  become: false
  run_once: true
  when:
    - cvp_apply_configlets | bool
    - cvp_server | length > 0
    - cvp_token | length > 0

- name: Create CVP change control for AVD-generated configlets
  arista.cvp.cv_change_control_v3:
    cvp_server: "{{ cvp_server }}"
    cvp_token: "{{ cvp_token_value }}"
    state: "{{ cvp_change_control_state }}"
    name: "{{ cvp_change_control_name }}"
    notes: "{{ cvp_change_control_notes }}"
    activities:
      - action: "Configlet Push"
        name: "Apply VXLAN VLAN {{ target_vlan_id }} configlets"
        arguments:
          - "{{ _avd_configlets.keys() | list }}"
  delegate_to: localhost
  become: false
  run_once: true
  when:
    - cvp_apply_configlets | bool
    - cvp_server | length > 0
    - cvp_token | length > 0
