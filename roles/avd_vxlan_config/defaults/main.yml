---
# -----------------------------------------------------------------------------
# avd_vxlan_config defaults
# -----------------------------------------------------------------------------
# Generates a CVP configlet for an Arista VXLAN VLAN migration using
# arista.avd.eos_cli_config_gen.  Deployment to CVP is still performed by the
# arista.cvp collection so the workflow does not need a full AVD fabric model.
# -----------------------------------------------------------------------------

# VLAN to migrate.  Usually supplied by the workflow playbook.
target_vlan_id: ""
target_data_center: ""
target_vrf: ""

# Directory where AVD-generated configlets are stored.
# Prefer reports_dir (set in group_vars) so core/ and advanced/ playbooks share one path.
avd_configlet_build_dir: "{{ reports_dir | default(playbook_dir ~ '/../../reports') }}/cvp_configlets"
avd_output_dir: "{{ avd_configlet_build_dir }}/avd"
# Shared temp dir for arista.avd.validate_inputs + eos_cli_config_gen (AVD 6; 5.x has no validate_inputs).
avd_tmp_dir: "{{ avd_output_dir }}/tmp_eos_cli_config_gen"
avd_keep_tmp_files: false

# Off by default. VRFs and their L3 VNIs already exist. Set true only to
# emit a per-VRF VNI import on border leaves.
avd_build_borderleaf_config: false
# Match both "border" and common "blf" naming (e.g. chi01-blf01).
avd_borderleaf_regex: "(?i)(border|blf)"

# Push to CloudVision, create a change control and wait for it. The
# change-control settings live in roles/cvp_change_control/defaults/main.yml.
cvp_apply_configlets: false

# Default loopback / interface values used in the generated structured config.
avd_vxlan_source_interface: Loopback1
avd_vxlan_udp_port: 4789
