---
# -----------------------------------------------------------------------------
# migrate_to_vxlan defaults
# -----------------------------------------------------------------------------

# If true, remove the local SVI for a VLAN that is being migrated to VXLAN.
# Default is false: preserve L3 gateway on the local device until explicitly
# told otherwise.
migrate_remove_local_svi: false

# Apply the generated config as a replace-block (false) or merge lines (true).
# Keep as merge so unrelated config is preserved.
migrate_config_match: line
migrate_config_replace: line

# Validate VXLAN reachability after changes.
validate_after_migration: true
