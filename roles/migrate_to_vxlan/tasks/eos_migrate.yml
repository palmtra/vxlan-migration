---
# -----------------------------------------------------------------------------
# Arista EOS VXLAN migration
# -----------------------------------------------------------------------------

- name: Render EOS VXLAN configuration
  ansible.builtin.template:
    src: eos_vxlan_config.j2
    dest: "/tmp/eos_vxlan_config_{{ inventory_hostname }}.cfg"
  delegate_to: localhost
  become: false
  check_mode: false
  changed_when: false

- name: Apply EOS VXLAN configuration
  arista.eos.eos_config:
    src: eos_vxlan_config.j2
    match: line
    replace: line
  when: _vlans_to_migrate | length > 0

- name: Remove local SVI for migrated VLANs (optional)
  arista.eos.eos_config:
    lines:
      - "no interface Vlan{{ item.id }}"
  loop: "{{ _vlans_to_migrate }}"
  when:
    - migrate_remove_local_svi | bool
    - _vlans_to_migrate | length > 0
  loop_control:
    label: "{{ item.id }}"
