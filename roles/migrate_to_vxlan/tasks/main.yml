---
# -----------------------------------------------------------------------------
# migrate_to_vxlan
# -----------------------------------------------------------------------------
# LEGACY / FOOT-GUN PATH: applies VXLAN config directly to EOS devices and
# bypasses CVP change control. Prefer playbooks/core/workflow_deploy.yml.
#
# Requires allow_direct_device_push=true. See docs/OS_SUPPORT.md and README.
# -----------------------------------------------------------------------------

- name: Block direct-to-device migration unless explicitly allowed
  ansible.builtin.fail:
    msg: >-
      roles/migrate_to_vxlan applies config directly to devices and bypasses CVP
      change control. Refusing to run (allow_direct_device_push={{ allow_direct_device_push | default(false) }}).
      Use playbooks/core/workflow_deploy.yml for production migrations, or set
      -e allow_direct_device_push=true only after lab review.
  when: not (allow_direct_device_push | default(false) | bool)

- name: Identify VLANs to migrate
  ansible.builtin.set_fact:
    _vlans_to_migrate: "{{ _effective_vlans | selectattr('action', 'equalto', 'migrate') | list }}"

- name: Fail if any migrate VLAN is missing a VNI
  ansible.builtin.fail:
    msg: "VLAN {{ item.id }} ({{ item.name }}) is marked migrate but has no vni."
  when: item.vni is not defined or item.vni == none
  loop: "{{ _vlans_to_migrate }}"
  loop_control:
    label: "{{ item.id }}"

- name: Report migration scope
  ansible.builtin.debug:
    msg: "Migrating VLANs (DIRECT DEVICE PATH): {{ _vlans_to_migrate | map(attribute='id') | list }}"

- name: Include EOS migration tasks
  ansible.builtin.include_tasks: eos_migrate.yml
  when: network_os_family == 'eos'

- name: Validate VXLAN state after migration
  ansible.builtin.include_tasks: validate.yml
  when: validate_after_migration | bool
