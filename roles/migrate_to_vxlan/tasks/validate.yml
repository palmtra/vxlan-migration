---
# -----------------------------------------------------------------------------
# Post-migration validation for Arista EOS only
# -----------------------------------------------------------------------------

- name: Validate EOS VXLAN vlan-to-vni mappings
  ansible.netcommon.cli_command:
    command: show vxlan vlan-to-vni
  register: _eos_vxlan_validate
  check_mode: false
  changed_when: false
  failed_when: false

- name: Display validation results
  ansible.builtin.debug:
    var: _eos_vxlan_validate.stdout_lines
  when: _eos_vxlan_validate.stdout_lines is defined

- name: Fail if expected VLAN/VNI mappings are not present
  ansible.builtin.fail:
    msg: "VNI {{ item.vni }} for VLAN {{ item.id }} not found in VXLAN output"
  when:
    - _eos_vxlan_validate.stdout is defined
    - item.vni | string not in _eos_vxlan_validate.stdout
      or item.id | string not in _eos_vxlan_validate.stdout
  loop: "{{ _vlans_to_migrate }}"
  loop_control:
    label: "{{ item.id }}"
