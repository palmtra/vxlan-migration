---
# -----------------------------------------------------------------------------
# Cisco IOS/IOS-XE VXLAN migration
# -----------------------------------------------------------------------------

- name: Render IOS VXLAN configuration
  ansible.builtin.template:
    src: ios_vxlan_config.j2
    dest: "/tmp/ios_vxlan_config_{{ inventory_hostname }}.cfg"
  delegate_to: localhost
  become: false
  check_mode: false
  changed_when: false

- name: Apply IOS VXLAN configuration
  cisco.ios.ios_config:
    src: ios_vxlan_config.j2
    match: "{{ migrate_config_match }}"
    replace: "{{ migrate_config_replace }}"
  when: _vlans_to_migrate | length > 0

- name: Remove local SVI for migrated VLANs (optional)
  cisco.ios.ios_config:
    lines:
      - "no interface Vlan{{ item.id }}"
  loop: "{{ _vlans_to_migrate }}"
  when:
    - migrate_remove_local_svi | bool
    - _vlans_to_migrate | length > 0
  loop_control:
    label: "{{ item.id }}"
