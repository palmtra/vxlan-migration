---
# -----------------------------------------------------------------------------
# cvp_rollback
# -----------------------------------------------------------------------------
# Reverts a VXLAN migration by overwriting the same CVP configlet names that
# roles/cvp_deploy created with "no ..." rollback content, then creates a new
# change control to push that update. Mirrors cvp_deploy's structure and
# safety gating (cvp_apply_configlets, explicit-approval-required) so a
# rollback in a non-applying (dry-run) environment only renders configlets
# to disk for review, exactly like a forward deploy would.
# -----------------------------------------------------------------------------

- name: Ensure configlet build directory exists
  ansible.builtin.file:
    path: "{{ cvp_configlet_build_dir }}"
    state: directory
    mode: '0755'
  delegate_to: localhost
  become: false
  run_once: true
  check_mode: false

- name: Compute VLAN being rolled back from the local VLAN DB
  ansible.builtin.set_fact:
    _vlan_to_migrate: "{{ hostvars['localhost']['_target_vlan_record'] | default({}) }}"
  delegate_to: localhost
  become: false
  run_once: true

- name: Fail if target VLAN record is not available on localhost
  ansible.builtin.fail:
    msg: >-
      No target VLAN record found on localhost. Run roles/vlan_db before cvp_rollback,
      or ensure target_vlan_id is set.
  when: _vlan_to_migrate | length == 0
  delegate_to: localhost
  become: false
  run_once: true

- name: Determine CVP rollback target devices from the local VLAN DB
  ansible.builtin.set_fact:
    _cvp_target_devices: "{{ _vlan_to_migrate.target_switches | default([]) }}"
  delegate_to: localhost
  become: false
  run_once: true
  check_mode: false

- name: Fail if no CVP target switches were declared for rollback
  ansible.builtin.fail:
    msg: >-
      VLAN {{ target_vlan_id }} has no target_switches in the local VLAN DB.
      Nothing to roll back.
  when: _cvp_target_devices | length == 0
  delegate_to: localhost
  become: false
  run_once: true

- name: Render leaf VXLAN rollback configlet per target device
  ansible.builtin.template:
    src: leaf_vxlan_rollback_configlet.j2
    dest: "{{ cvp_configlet_build_dir }}/vxlan_vlan{{ target_vlan_id }}_{{ item }}.cfg"
    mode: '0644'
  loop: "{{ _cvp_target_devices }}"
  delegate_to: localhost
  become: false
  run_once: true
  check_mode: false
  vars:
    _device_hostname: "{{ item }}"
    _vtep_bgp: "{{ hostvars[item] | host_vtep_bgp }}"
    _device_bgp_asn: "{{ _vtep_bgp.asn | default(avd_default_bgp_as | default('', true), true) }}"
    _device_loopback_ip: "{{ _vtep_bgp.router_id }}"

- name: Render border-leaf import rollback configlet
  ansible.builtin.template:
    src: borderleaf_import_rollback_configlet.j2
    dest: "{{ cvp_configlet_build_dir }}/vxlan_vlan{{ target_vlan_id }}_borderleaf_import.cfg"
    mode: '0644'
  delegate_to: localhost
  become: false
  run_once: true
  check_mode: false
  when: cvp_build_borderleaf_config | bool
  vars:
    _vtep_bgp: "{{ hostvars[_cvp_target_devices | first] | host_vtep_bgp }}"
    _device_bgp_asn: "{{ _vtep_bgp.asn | default(avd_default_bgp_as | default('', true), true) }}"

- name: Load generated leaf rollback configlets
  ansible.builtin.set_fact:
    _cvp_leaf_configlets: "{{ _cvp_leaf_configlets | default({}) | combine({
      ('vxlan_vlan' + target_vlan_id | string + '_' + item): lookup('ansible.builtin.file',
      cvp_configlet_build_dir + '/vxlan_vlan' + target_vlan_id | string + '_' + item + '.cfg')
    }) }}"
  loop: "{{ _cvp_target_devices }}"
  delegate_to: localhost
  become: false
  run_once: true
  check_mode: false

- name: Load generated border-leaf rollback configlet
  ansible.builtin.set_fact:
    _cvp_borderleaf_configlet: "{{ lookup('ansible.builtin.file',
      cvp_configlet_build_dir + '/vxlan_vlan' + target_vlan_id | string + '_borderleaf_import.cfg') }}"
  delegate_to: localhost
  become: false
  run_once: true
  check_mode: false
  when: cvp_build_borderleaf_config | bool

- name: Build full CVP rollback configlet map
  ansible.builtin.set_fact:
    _cvp_configlets: "{{ _cvp_leaf_configlets | default({}) | combine({
      ('vxlan_vlan' + target_vlan_id | string + '_borderleaf_import'):
      (_cvp_borderleaf_configlet | default(''))
    }) }}"
  delegate_to: localhost
  become: false
  run_once: true
  check_mode: false

- name: Enforce explicit approval before any auto-executing rollback change control
  ansible.builtin.fail:
    msg: >-
      cvp_change_control_state is set to '{{ cvp_change_control_state }}' which would
      auto-execute on CVP. Set cvp_change_control_auto_execute_allowed=true and confirm
      the rollback change control has been reviewed before proceeding.
  when:
    - cvp_apply_configlets | bool
    - cvp_change_control_state in ['approve', 'execute', 'approve_and_execute', 'schedule_and_approve']
    - not cvp_change_control_auto_execute_allowed | bool

- name: Overwrite CVP configlets with rollback content (only when cvp_apply_configlets is true)
  arista.cvp.cv_configlet_v3:
    cvp_server: "{{ cvp_server }}"
    cvp_token: "{{ cvp_token }}"
    configlets: "{{ _cvp_configlets }}"
    state: present
  delegate_to: localhost
  become: false
  run_once: true
  no_log: true
  when:
    - cvp_apply_configlets | bool
    - cvp_server | length > 0
    - cvp_token | length > 0

- name: Create CVP rollback change control (only when cvp_apply_configlets is true)
  arista.cvp.cv_change_control_v3:
    cvp_server: "{{ cvp_server }}"
    cvp_token: "{{ cvp_token }}"
    state: "{{ cvp_change_control_state }}"
    name: "{{ cvp_rollback_change_control_name }}"
    notes: "{{ cvp_rollback_change_control_notes }}"
    activities:
      - action: "Configlet Push"
        name: "Rollback VXLAN VLAN {{ target_vlan_id }} configlets"
        arguments:
          - "{{ _cvp_configlets.keys() | list }}"
  delegate_to: localhost
  become: false
  run_once: true
  no_log: true
  when:
    - cvp_apply_configlets | bool
    - cvp_server | length > 0
    - cvp_token | length > 0

- name: Report generated rollback configlets
  ansible.builtin.debug:
    msg:
      - "Generated rollback configlets for: {{ _cvp_target_devices }}"
      - "Configlet directory: {{ cvp_configlet_build_dir }}"
      - "Applied to CVP: {{ cvp_apply_configlets | bool }}"
  delegate_to: localhost
  become: false
  run_once: true
