---
# -----------------------------------------------------------------------------
# cvp_rollback
# -----------------------------------------------------------------------------
# Reverts a VXLAN migration by overwriting the same CVP configlet names that
# roles/cvp_deploy created with "no ..." rollback content, then creates a new
# change control to push that update. Mirrors cvp_deploy's structure and
# safety gating (cvp_apply_configlets, explicit-approval-required) so a
# rollback in a non-applying (dry-run) environment only renders configlets
# to disk for review, exactly like a forward deploy would.
#
# cvp_deploy_method: studios instead re-renders each leaf's single Static
# Configuration Studio configlet without this VLAN (roles/avd_vxlan_config,
# avd_studio_rollback) and deploys it through a workspace and change control.
# -----------------------------------------------------------------------------

- name: Compute VLAN being rolled back from the local VLAN DB
  ansible.builtin.set_fact:
    _vlan_to_migrate: "{{ hostvars['localhost']['_target_vlan_record'] | default({}) }}"
  delegate_to: localhost
  become: false
  run_once: true

- name: Fail if target VLAN record is not available on localhost
  ansible.builtin.fail:
    msg: >-
      No target VLAN record found on localhost. Run roles/vlan_db before cvp_rollback,
      or ensure target_vlan_id is set.
  when: _vlan_to_migrate | length == 0
  delegate_to: localhost
  become: false
  run_once: true

# Same device set as roles/cvp_deploy (target_switches plus gateway_leafs), so
# a centralized_anycast gateway pair outside target_switches is rolled back too.
- name: Determine CVP rollback target devices from the local VLAN DB
  ansible.builtin.set_fact:
    _cvp_target_devices: "{{ _vlan_to_migrate | vlan_config_hosts }}"
  delegate_to: localhost
  become: false
  run_once: true
  check_mode: false

- name: Fail if no CVP target switches were declared for rollback
  ansible.builtin.fail:
    msg: >-
      VLAN {{ target_vlan_id }} has no target_switches or gateway_leafs in the local VLAN DB.
      Nothing to roll back.
  when: _cvp_target_devices | length == 0
  delegate_to: localhost
  become: false
  run_once: true

- name: Roll back with "no" configlets (Network Provisioning)
  ansible.builtin.include_tasks: configlets.yml
  when: cvp_deploy_method | default('configlets') != 'studios'

# Studios: the leaf's single configlet is re-rendered without this VLAN and
# deployed the same way as the migration (a workspace and change control).
- name: Roll back by re-deploying each leaf without this VLAN (Studios)
  ansible.builtin.include_role:
    name: avd_vxlan_config
  vars:
    avd_studio_rollback: true
    cvp_change_control_name: "{{ cvp_rollback_change_control_name }}"
    cvp_change_control_notes: "{{ cvp_rollback_change_control_notes }}"
  when: cvp_deploy_method | default('configlets') == 'studios'
