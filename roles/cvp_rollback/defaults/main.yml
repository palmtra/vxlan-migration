---
# -----------------------------------------------------------------------------
# cvp_rollback defaults
# -----------------------------------------------------------------------------
# Reverts the VXLAN migration configlets generated by roles/cvp_deploy by
# overwriting the SAME configlet names with "no ..." rollback content and
# creating a new CVP change control to push that update.
#
# This role is deliberately self-contained (its own copies of the CVP
# connection / apply-gating defaults below) rather than relying on
# roles/cvp_deploy's role defaults being loaded, since role defaults are
# not guaranteed to be present on the same hostvars across separate plays
# (e.g. Step 5 in workflow_deploy.yml may target only eos_devices,
# while this role runs against network_devices hosts in Step 6). If you
# override cvp_apply_configlets / cvp_change_control_state / etc. for
# roles/cvp_deploy at the inventory or extra-vars level, override them the
# same way here too so forward deploy and rollback stay consistent.
# -----------------------------------------------------------------------------

cvp_url: ""
cvp_token: ""
cvp_validate_certs: true
cvp_server: "{{ cvp_url }}"

cvp_configlet_build_dir: "{{ reports_dir | default(project_root ~ '/reports') }}/cvp_configlets"

# When true, push the rollback configlets to CVP and create a rollback
# change control. When false, rollback configlets are only rendered to
# files for review -- same semantics as cvp_deploy's cvp_apply_configlets.
cvp_apply_configlets: false

# When true, rollback templates may emit "no vlan" / VRF instance teardown.
# Default false: only reverse VXLAN mappings (safer if VLAN pre-existed).
cvp_rollback_allow_destructive_no_vlan: false

cvp_rollback_change_control_name: "ROLLBACK - VXLAN migration - VLAN {{ target_vlan_id }}"
cvp_rollback_change_control_notes: |
  Auto-generated rollback change control reverting the VXLAN migration
  configlets for legacy VLAN {{ target_vlan_id }} in data center
  {{ target_data_center | default('unknown') }}, triggered by a failed
  post-change verification.

cvp_change_control_state: "set"
cvp_change_control_auto_execute_allowed: false

cvp_borderleaf_regex: ".*border.*"
# Same default as cvp_deploy: do not create or rebind the VRF L3 VNI.
cvp_build_borderleaf_config: false
