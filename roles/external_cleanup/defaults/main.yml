---
# -----------------------------------------------------------------------------
# external_cleanup defaults
# -----------------------------------------------------------------------------
# Marks VLANs that were discovered on legacy switches as ready for external
# cleanup (legacy decommission).  No destructive changes are made here.
# -----------------------------------------------------------------------------

# When true, write a hand-off artifact that an external tool can consume.
external_cleanup_write_handoff: true
external_cleanup_handoff_dir: "{{ playbook_dir }}/../reports"

# Optional REST endpoint to notify an external cleanup orchestrator.
# Leave empty to skip the API call entirely.
external_cleanup_api_url: ""
external_cleanup_api_method: POST
external_cleanup_api_timeout: 30
