---
# -----------------------------------------------------------------------------
# vlan_db defaults
# -----------------------------------------------------------------------------
# Per-DC VLAN databases live under vars/vlans/<data_center>/*.yml (one file per VLAN).
# See vars/vlans/README.md and vars/vlans/<dc>/_example.yml.
vlan_db_dir: "{{ project_root | default(playbook_dir | regex_replace('/playbooks(/core|/advanced)?$', '')) }}/vars/vlans"

# Allowed service_type values. l2_l3 is deprecated.
# l3: gateway is hosted inside the VXLAN fabric (gateway_leafs).
# l2: gateway stays outside; the fabric provides Layer-2 transport.
vlan_db_valid_service_types:
  - l2
  - l3

# When true, every target_switches entry must exist in the Ansible inventory.
vlan_db_validate_target_switches: true

# When true, discovery can run for a VLAN ID not yet present in the DC database.
discovery_allow_probe: false

# Default service_type for probe (not-yet-in-DB) VLAN records.
discovery_probe_service_type: l3
