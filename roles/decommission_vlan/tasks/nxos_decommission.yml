---
# -----------------------------------------------------------------------------
# Cisco NXOS VLAN decommission
# -----------------------------------------------------------------------------

- name: Discover trunk interfaces on NXOS
  ansible.netcommon.cli_command:
    command: show interface trunk
  register: _nxos_trunk_output
  check_mode: false
  changed_when: false
  failed_when: false

- name: Build list of NXOS trunk interfaces
  ansible.builtin.set_fact:
    _nxos_trunk_interfaces: "{{ (_nxos_trunk_output.stdout | default('')) | regex_findall('(?i)^(Ethernet\\S+|port-channel\\S+)\\s+', multiline=true) }}"

- name: Remove SVIs for decommissioned VLANs
  cisco.nxos.nxos_config:
    lines:
      - "no interface vlan{{ item.id }}"
  loop: "{{ _vlans_to_decommission }}"
  loop_control:
    label: "{{ item.id }}"

- name: Prune decommissioned VLANs from NXOS trunks
  cisco.nxos.nxos_config:
    src: nxos_trunk_prune.j2
    match: line
    replace: line
  when:
    - decommission_prune_trunks | bool
    - _vlans_to_decommission | length > 0
    - _nxos_trunk_interfaces | length > 0 or
      (_vlans_to_decommission | selectattr('explicit_trunk_interfaces', 'defined') | list) | length > 0

- name: Delete decommissioned VLANs on NXOS
  cisco.nxos.nxos_config:
    lines:
      - "no vlan {{ item.id }}"
  loop: "{{ _vlans_to_decommission }}"
  when: decommission_delete_vlan | bool
  loop_control:
    label: "{{ item.id }}"
