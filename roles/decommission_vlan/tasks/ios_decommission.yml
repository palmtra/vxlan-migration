---
# -----------------------------------------------------------------------------
# Cisco IOS/IOS-XE VLAN decommission
# -----------------------------------------------------------------------------

- name: Discover trunk interfaces on IOS
  ansible.netcommon.cli_command:
    command: show interfaces trunk
  register: _ios_trunk_output
  check_mode: false
  changed_when: false
  failed_when: false

- name: Build list of IOS trunk interfaces
  ansible.builtin.set_fact:
    _ios_trunk_interfaces: "{{ (_ios_trunk_output.stdout | default('')) | regex_findall('^(\\S+)\\s+\\S+\\s+\\S+\\s+trunking', multiline=true) }}"

- name: Remove SVIs for decommissioned VLANs
  cisco.ios.ios_config:
    lines:
      - "no interface Vlan{{ item.id }}"
  loop: "{{ _vlans_to_decommission }}"
  loop_control:
    label: "{{ item.id }}"

- name: Prune decommissioned VLANs from IOS trunks
  cisco.ios.ios_config:
    src: ios_trunk_prune.j2
    match: line
    replace: line
  when:
    - decommission_prune_trunks | bool
    - _vlans_to_decommission | length > 0
    - _ios_trunk_interfaces | length > 0 or
      (_vlans_to_decommission | selectattr('explicit_trunk_interfaces', 'defined') | list) | length > 0

- name: Delete decommissioned VLANs on IOS
  cisco.ios.ios_config:
    lines:
      - "no vlan {{ item.id }}"
  loop: "{{ _vlans_to_decommission }}"
  when: decommission_delete_vlan | bool
  loop_control:
    label: "{{ item.id }}"
