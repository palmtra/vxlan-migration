---
# -----------------------------------------------------------------------------
# cvp_deploy
# -----------------------------------------------------------------------------
# Generates CVP configlets for Arista leaf / border-leaf switches where the
# target VLAN was discovered, then optionally applies them via CVP and creates
# a change control.
# -----------------------------------------------------------------------------

- name: Ensure configlet build directory exists
  ansible.builtin.file:
    path: "{{ cvp_configlet_build_dir }}"
    state: directory
    mode: '0755'
  delegate_to: localhost
  become: false
  run_once: true
  check_mode: false

- name: Compute VLAN to migrate for CVP
  ansible.builtin.set_fact:
    _vlan_to_migrate: "{{ hostvars['localhost']['_target_vlan_record'] | default({}) }}"
  delegate_to: localhost
  become: false
  run_once: true

- name: Fail if target VLAN record is not available on localhost
  ansible.builtin.fail:
    msg: >-
      No target VLAN record found on localhost. Run roles/vlan_db before cvp_deploy,
      or ensure target_vlan_id is set.
  when: _vlan_to_migrate | length == 0
  delegate_to: localhost
  become: false
  run_once: true

- name: Determine CVP target devices from the local VLAN DB
  ansible.builtin.set_fact:
    _cvp_target_devices: "{{ _vlan_to_migrate | vlan_config_hosts }}"
  delegate_to: localhost
  become: false
  run_once: true
  check_mode: false

- name: Fail if no CVP target switches were declared for the VLAN
  ansible.builtin.fail:
    msg: >-
      VLAN {{ target_vlan_id }} has no target_switches in the local VLAN DB.
      Aborting CVP deployment.
  when: _cvp_target_devices | length == 0
  delegate_to: localhost
  become: false
  run_once: true

- name: Refuse a multicast BUM group (the fabric uses head-end replication only)
  ansible.builtin.fail:
    msg: >-
      VLAN {{ target_vlan_id }} sets mcast_group {{ _vlan_to_migrate.mcast_group }}.
      The fabric floods BUM with head-end replication (EVPN type-3 flood lists),
      not multicast. Remove mcast_group from the VLAN record.
  when: _vlan_to_migrate.mcast_group | default('') | string | length > 0
  delegate_to: localhost
  become: false
  run_once: true

- name: Fail when a VTEP cannot build the BGP VLAN route distinguisher
  ansible.builtin.fail:
    msg: >-
      VLAN {{ target_vlan_id }} on {{ item }} needs {{ _bgp.missing | join(' and ') }}
      to publish the EVPN VLAN. Discovery did not find that on the switch,
      and the VLAN record has no value for it.
  loop: "{{ _cvp_target_devices }}"
  vars:
    _vtep_bgp: "{{ hostvars[item] | host_vtep_bgp }}"
    _bgp: "{{ _vlan_to_migrate | bgp_vlan_evpn(item, _vtep_bgp.asn | default(avd_default_bgp_as | default('', true), true), _vtep_bgp.router_id) }}"
  when: _bgp.missing | default([]) | length > 0
  delegate_to: localhost
  become: false
  run_once: true

- name: Render leaf VXLAN configlet per target device
  ansible.builtin.template:
    src: leaf_vxlan_configlet.j2
    dest: "{{ cvp_configlet_build_dir }}/vxlan_vlan{{ target_vlan_id }}_{{ item }}.cfg"
    mode: '0644'
  loop: "{{ _cvp_target_devices }}"
  delegate_to: localhost
  become: false
  run_once: true
  check_mode: false
  vars:
    _device_hostname: "{{ item }}"
    _vtep_bgp: "{{ hostvars[item] | host_vtep_bgp }}"
    _device_bgp_asn: "{{ _vtep_bgp.asn | default(avd_default_bgp_as | default('', true), true) }}"
    _device_loopback_ip: "{{ _vtep_bgp.router_id }}"

- name: Render border-leaf import configlet
  ansible.builtin.template:
    src: borderleaf_import_configlet.j2
    dest: "{{ cvp_configlet_build_dir }}/vxlan_vlan{{ target_vlan_id }}_borderleaf_import.cfg"
    mode: '0644'
  delegate_to: localhost
  become: false
  run_once: true
  check_mode: false
  when: cvp_build_borderleaf_config | bool
  vars:
    _device_hostname: "{{ _cvp_target_devices | first }}"
    _vtep_bgp: "{{ hostvars[_cvp_target_devices | first] | host_vtep_bgp }}"
    _device_bgp_asn: "{{ _vtep_bgp.asn | default(avd_default_bgp_as | default('', true), true) }}"
    _device_loopback_ip: "{{ _vtep_bgp.router_id }}"

- name: Load generated leaf configlets
  ansible.builtin.set_fact:
    _cvp_leaf_configlets: "{{ _cvp_leaf_configlets | default({}) | combine({
      ('vxlan_vlan' + target_vlan_id | string + '_' + item): lookup('ansible.builtin.file',
      cvp_configlet_build_dir + '/vxlan_vlan' + target_vlan_id | string + '_' + item + '.cfg')
    }) }}"
  loop: "{{ _cvp_target_devices }}"
  delegate_to: localhost
  become: false
  run_once: true
  check_mode: false

- name: Load generated border-leaf import configlet
  ansible.builtin.set_fact:
    _cvp_borderleaf_configlet: "{{ lookup('ansible.builtin.file',
      cvp_configlet_build_dir + '/vxlan_vlan' + target_vlan_id | string + '_borderleaf_import.cfg') }}"
  delegate_to: localhost
  become: false
  run_once: true
  check_mode: false
  when: cvp_build_borderleaf_config | bool

- name: Build full CVP configlet map
  ansible.builtin.set_fact:
    _cvp_configlets: >-
      {{ _cvp_leaf_configlets | default({}) | combine({
         ('vxlan_vlan' + target_vlan_id | string + '_borderleaf_import'): _cvp_borderleaf_configlet}
         if cvp_build_borderleaf_config | bool else {}) }}
  delegate_to: localhost
  become: false
  run_once: true
  check_mode: false

- name: Identify border leaf devices
  ansible.builtin.set_fact:
    _cvp_borderleaf_devices: "{{ groups['eos_devices'] | default([]) |
      select('match', cvp_borderleaf_regex) | list }}"
  delegate_to: localhost
  become: false
  run_once: true
  check_mode: false

- name: Push to CloudVision, create the change control and wait for it (cvp_apply_configlets)
  ansible.builtin.include_role:
    name: cvp_change_control
  vars:
    cvp_push_configlets: "{{ _cvp_configlets }}"
    cvp_push_assignments: >-
      {% set out = {} %}{% for host in _cvp_target_devices %}{% set _ = out.update({host: ['vxlan_vlan' ~ target_vlan_id ~ '_' ~ host]}) %}{% endfor %}{%
      if cvp_build_borderleaf_config | bool %}{% for host in _cvp_borderleaf_devices %}{% set _ = out.update({host: out.get(host, [])
      + ['vxlan_vlan' ~ target_vlan_id ~ '_borderleaf_import']}) %}{% endfor %}{% endif %}{{ out }}
  when: cvp_apply_configlets | bool

- name: Report generated CVP configlets
  ansible.builtin.debug:
    msg:
      - "Generated CVP configlets for: {{ _cvp_target_devices }}"
      - "Configlet directory: {{ cvp_configlet_build_dir }}"
      - "Applied to CVP: {{ cvp_apply_configlets | bool }}"
  delegate_to: localhost
  become: false
  run_once: true
