---
# -----------------------------------------------------------------------------
# cvp_deploy defaults
# -----------------------------------------------------------------------------
# Builds Arista CVP configlets for VXLAN migration and optionally creates a
# change control.  Safe defaults keep configlet generation local until
# cvp_apply_configlets is set to true.
# -----------------------------------------------------------------------------

# CloudVision connection: the arista.cvp modules run on the CloudVision
# inventory host over httpapi. Set it in inventory/group_vars/CVAAS/ (token
# from Ansible Vault or AAP credentials). See roles/cvp_change_control.

# Generated configlets: one directory per data center and VLAN, so a run never
# touches another VLAN's files. Each run replaces this VLAN's configs/ (no
# versions are kept):
#   reports/cvp_configlets/<dc>/vlan<id>/configs/vxlan_vlan<id>_<leaf>.cfg
# The same layout is defined in roles/avd_vxlan_config and roles/cvp_rollback.
cvp_configlet_root: "{{ reports_dir | default(project_root ~ '/reports') }}/cvp_configlets"
cvp_configlet_data_center: >-
  {{ (target_data_center | default('', true)
      or (hostvars['localhost']['_target_vlan_record'] | default({})).data_center | default('', true)
      or 'unknown_dc') | string | trim | lower }}
cvp_configlet_vlan_dir: "{{ cvp_configlet_root }}/{{ cvp_configlet_data_center }}/vlan{{ target_vlan_id }}"
cvp_configlet_build_dir: "{{ cvp_configlet_vlan_dir }}/configs"

# When true, push generated configlets to CloudVision, create a change control
# and wait for it. When false, configlets are only rendered to files for review.
cvp_apply_configlets: false

# Change control: see roles/cvp_change_control/defaults/main.yml
# (cvp_change_control_name / _notes / _state / _wait, cvp_inventory_group).

# Device tags/regex used to identify border leafs from the inventory.
cvp_borderleaf_regex: ".*border.*"

# Border-leaf VRF import is off. The fabric VRF and its L3 VNI already exist.
# A migration either extends L2 to endpoint leaves, or adds the VLAN L2 VNI
# and the gateway SVI on leaves that already have the VRF. Set this true only
# when the change must create the VRF or bind vxlan vrf <vrf> vni.
cvp_build_borderleaf_config: false
