---
# -----------------------------------------------------------------------------
# cvp_deploy defaults
# -----------------------------------------------------------------------------
# Builds Arista CVP configlets for VXLAN migration and optionally creates a
# change control.  Safe defaults keep configlet generation local until
# cvp_apply_configlets is set to true.
# -----------------------------------------------------------------------------

# CVP/CVAAS connection details.  Supply via Ansible Vault, a variable file,
# or AAP credentials (injected as extra vars); not read from environment variables.
cvp_url: ""
cvp_token: ""
cvp_validate_certs: true

# Module-facing aliases used by the arista.cvp collection.
cvp_server: "{{ cvp_url }}"

# Generated configlet storage directory.
cvp_configlet_build_dir: "{{ reports_dir | default(project_root ~ '/reports') }}/cvp_configlets"

# When true, push generated configlets to CVP and create a change control.
# When false, configlets are only rendered to files for review.
cvp_apply_configlets: false

# Change control metadata.
cvp_change_control_name: "VXLAN migration - VLAN {{ target_vlan_id }}"
cvp_change_control_notes: |
  Auto-generated change control for migrating legacy VLAN {{ target_vlan_id }}
  to VXLAN VNI {{ _vlan_to_migrate.vni | default('TBD') }} in data center
  {{ target_data_center | default('unknown') }}.

# Change control action. 'set' creates a pending change control that requires
# manual approval/execution in CVP. Use 'approve_and_execute' only after
# explicit review; it is intentionally not the default.
cvp_change_control_state: "set"
cvp_change_control_auto_execute_allowed: false

# Device tags/regex used to identify border leafs from the inventory.
cvp_borderleaf_regex: ".*border.*"

# Border-leaf VRF import is off. The fabric VRF and its L3 VNI already exist.
# A migration either extends L2 to endpoint leaves, or adds the VLAN L2 VNI
# and the gateway SVI on leaves that already have the VRF. Set this true only
# when the change must create the VRF or bind vxlan vrf <vrf> vni.
cvp_build_borderleaf_config: false
