---
# -----------------------------------------------------------------------------
# netbox_check defaults
# -----------------------------------------------------------------------------
# Read-only SSOT lookup.  The role verifies that the target VLAN exists in
# NetBox (primary SSOT) before the migration proceeds.  If NetBox itself is
# unreachable (not configured, connection error, timeout, non-2xx response),
# it falls back to the local VLAN registry (vlan_registry_file, see
# inventory/group_vars/all/main.yml) as a secondary/backup SSOT.  A definitive
# "not found" from a reachable NetBox is authoritative and does NOT trigger
# the local-registry fallback.  VLAN creation / VRF mapping in NetBox is a
# deferred improvement and is not performed here.
# -----------------------------------------------------------------------------

# Supply via Ansible Vault, a variable file, or AAP credentials.
netbox_url: ""
netbox_token: ""
netbox_validate_certs: true
netbox_timeout: 30

# When true, the role returns the NetBox object instead of failing.
netbox_return_facts: true

# Defer creation of missing VLANs.
netbox_create_missing_vlan: false
