---
# -----------------------------------------------------------------------------
# netbox_check
# -----------------------------------------------------------------------------
# Secondary NetBox validation after the local per-DC VLAN database has already
# validated the target VLAN (roles/vlan_db). NetBox is used to detect drift and
# to prepare future sync-back after migration — it does not override the local
# VLAN DB unless netbox_ssot_required is true.
#
# Sets:
#   _netbox_sync_status: not_configured | unreachable | found | missing
#   _netbox_vlan:        NetBox object when found
# -----------------------------------------------------------------------------

- name: Determine whether NetBox is configured
  ansible.builtin.set_fact:
    _netbox_configured: "{{ (netbox_url | default('', true) | length > 0) and (netbox_token | default('', true) | length > 0) }}"
  delegate_to: localhost
  become: false
  run_once: true

- name: Skip NetBox lookup when not configured
  ansible.builtin.set_fact:
    _netbox_sync_status: not_configured
  delegate_to: localhost
  become: false
  run_once: true
  when: not _netbox_configured

- name: Search NetBox for the target VLAN by VID
  ansible.builtin.uri:
    url: "{{ netbox_url }}/api/ipam/vlans/?vid={{ target_vlan_id | int }}"
    method: GET
    headers:
      Authorization: "Token {{ netbox_token }}"
      Accept: "application/json"
    validate_certs: "{{ netbox_validate_certs | bool }}"
    timeout: "{{ netbox_timeout | int }}"
    status_code: 200
  register: _netbox_vlan_lookup
  delegate_to: localhost
  become: false
  run_once: true
  when: _netbox_configured
  failed_when: false
  changed_when: false

- name: Determine NetBox reachability
  ansible.builtin.set_fact:
    _netbox_reachable: >-
      {{ _netbox_configured
         and (_netbox_vlan_lookup is defined)
         and (_netbox_vlan_lookup.status | default(0) == 200)
         and (_netbox_vlan_lookup.json is defined) }}
  delegate_to: localhost
  become: false
  run_once: true
  when: _netbox_configured

- name: Record NetBox unreachable status
  ansible.builtin.set_fact:
    _netbox_sync_status: unreachable
  delegate_to: localhost
  become: false
  run_once: true
  when:
    - _netbox_configured
    - not _netbox_reachable

- name: Record NetBox VLAN object when found
  ansible.builtin.set_fact:
    _netbox_vlan: "{{ _netbox_vlan_lookup.json.results | default([]) | first | default({}) }}"
  delegate_to: localhost
  become: false
  run_once: true
  when: _netbox_reachable

- name: Set NetBox sync status to found
  ansible.builtin.set_fact:
    _netbox_sync_status: found
  delegate_to: localhost
  become: false
  run_once: true
  when:
    - _netbox_reachable
    - _netbox_vlan | default({}) | length > 0

- name: Set NetBox sync status to missing
  ansible.builtin.set_fact:
    _netbox_sync_status: missing
  delegate_to: localhost
  become: false
  run_once: true
  when:
    - _netbox_reachable
    - _netbox_vlan | default({}) | length == 0

- name: Warn when NetBox has no record for the VLAN
  ansible.builtin.debug:
    msg:
      - "NetBox has no VLAN record for VID {{ target_vlan_id }}."
      - "Proceeding with local VLAN DB ({{ _ssot_source | default('local_registry') }})."
      - "Populate NetBox from the local DB after migration when ready."
  delegate_to: localhost
  become: false
  run_once: true
  when:
    - netbox_warn_on_missing_record | bool
    - _netbox_sync_status == 'missing'

- name: Fail only when NetBox is explicitly required and the record is missing
  ansible.builtin.fail:
    msg:
      - "VLAN {{ target_vlan_id }} does not exist in NetBox."
      - "netbox_ssot_required is true, so the run cannot proceed."
      - "Disable netbox_ssot_required for Core workflow, or create the NetBox record first."
  when:
    - netbox_ssot_required | bool
    - _netbox_sync_status == 'missing'
  delegate_to: localhost
  become: false
  run_once: true

- name: Report NetBox sync status
  ansible.builtin.debug:
    msg:
      - "Primary SSOT: {{ _ssot_source | default('local_registry') }}"
      - "NetBox sync status: {{ _netbox_sync_status | default('not_configured') }}"
      - "Local VLAN record: {{ _ssot_vlan.name | default('unknown') }} (VID {{ _ssot_vlan.id | default(target_vlan_id) }})"
  delegate_to: localhost
  become: false
  run_once: true
