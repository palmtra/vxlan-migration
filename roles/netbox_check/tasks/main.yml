---
# -----------------------------------------------------------------------------
# netbox_check
# -----------------------------------------------------------------------------
# Verifies the target VLAN exists in the canonical SSOT before a migration
# proceeds. NetBox is the primary SSOT. If NetBox itself cannot be reached
# (not configured, connection error, timeout, non-2xx response) this role
# falls back to the local VLAN registry (vars/vlan_registry.yml) as a
# secondary/backup source.
#
# The local registry is a backup, not a peer, to NetBox:
#   - If NetBox is reachable and says the VLAN does not exist, that is
#     authoritative and this role fails closed. The local registry is NOT
#     consulted in that case.
#   - The local registry is only consulted when NetBox itself is unreachable.
#   - If the local registry also has no match, this role fails closed with a
#     conflict/not-found error, ending the run.
#
# On success, sets:
#   _ssot_vlan:   normalized VLAN record (id, name, vrf, vni, site/data_center)
#   _ssot_source: 'netbox' or 'local_registry'
# -----------------------------------------------------------------------------

- name: Determine whether NetBox is configured
  ansible.builtin.set_fact:
    _netbox_configured: "{{ (netbox_url | default('', true) | length > 0) and (netbox_token | default('', true) | length > 0) }}"
  delegate_to: localhost
  become: false
  run_once: true

- name: Search NetBox for the target VLAN by VID
  ansible.builtin.uri:
    url: "{{ netbox_url }}/api/ipam/vlans/?vid={{ target_vlan_id | int }}"
    method: GET
    headers:
      Authorization: "Token {{ netbox_token }}"
      Accept: "application/json"
    validate_certs: "{{ netbox_validate_certs | bool }}"
    timeout: "{{ netbox_timeout | int }}"
    status_code: 200
  register: _netbox_vlan_lookup
  delegate_to: localhost
  become: false
  run_once: true
  when: _netbox_configured
  failed_when: false
  changed_when: false

- name: Determine whether NetBox was actually reachable
  ansible.builtin.set_fact:
    _netbox_reachable: >-
      {{ _netbox_configured
         and (_netbox_vlan_lookup is defined)
         and (_netbox_vlan_lookup.status | default(0) == 200)
         and (_netbox_vlan_lookup.json is defined) }}
  delegate_to: localhost
  become: false
  run_once: true

- name: Report NetBox unreachable and fall back to local registry
  ansible.builtin.debug:
    msg:
      - "NetBox unreachable or not configured (configured={{ _netbox_configured }}, status={{ _netbox_vlan_lookup.status | default('n/a') }})."
      - "Falling back to local VLAN registry: {{ vlan_registry_file }}"
  delegate_to: localhost
  become: false
  run_once: true
  when: not _netbox_reachable

- name: Record VLAN fact from NetBox
  ansible.builtin.set_fact:
    _netbox_vlan: "{{ _netbox_vlan_lookup.json.results | default([]) | first | default({}) }}"
  delegate_to: localhost
  become: false
  run_once: true
  when: _netbox_reachable

- name: Fail closed if NetBox is reachable but the VLAN does not exist there
  ansible.builtin.fail:
    msg:
      - "VLAN {{ target_vlan_id }} does not exist in NetBox."
      - "NetBox is reachable and authoritative here, so the local registry is not consulted."
      - "Automated VLAN creation and customer/VRF mapping is a deferred improvement."
  when:
    - _netbox_reachable
    - not netbox_create_missing_vlan | bool
    - _netbox_vlan | length == 0
  delegate_to: localhost
  become: false
  run_once: true

- name: Set SSOT fact from NetBox
  ansible.builtin.set_fact:
    _ssot_vlan:
      id: "{{ _netbox_vlan.vid | default(target_vlan_id) }}"
      name: "{{ _netbox_vlan.name | default('') }}"
      vrf: "{{ _netbox_vlan.tenant.name | default('') }}"
      site: "{{ _netbox_vlan.site.name | default('') }}"
    _ssot_source: netbox
  delegate_to: localhost
  become: false
  run_once: true
  when: _netbox_reachable

- name: Load local VLAN registry as a fallback SSOT
  ansible.builtin.include_vars:
    file: "{{ vlan_registry_file }}"
    name: _local_vlan_registry
  delegate_to: localhost
  become: false
  run_once: true
  when: not _netbox_reachable

- name: Look up the target VLAN in the local registry
  ansible.builtin.set_fact:
    _local_registry_vlan: "{{ _local_vlan_registry.vlans | selectattr('id', 'equalto', target_vlan_id | int) | first | default({}) }}"
  delegate_to: localhost
  become: false
  run_once: true
  when: not _netbox_reachable

- name: Fail closed if the VLAN is not found in NetBox (unreachable) or the local registry
  ansible.builtin.fail:
    msg:
      - "NetBox was unreachable, and VLAN {{ target_vlan_id }} was not found in the local registry ({{ vlan_registry_file }}) either."
      - "This is a conflict/not-found condition; ending the run rather than proceeding without a validated SSOT record."
  when:
    - not _netbox_reachable
    - _local_registry_vlan | default({}) | length == 0
  delegate_to: localhost
  become: false
  run_once: true

- name: Set SSOT fact from the local registry
  ansible.builtin.set_fact:
    _ssot_vlan:
      id: "{{ _local_registry_vlan.id }}"
      name: "{{ _local_registry_vlan.vlan_name | default(_local_registry_vlan.name | default('')) }}"
      vrf: "{{ _local_registry_vlan.vrf | default('') }}"
      site: "{{ _local_registry_vlan.site | default('') }}"
    _ssot_source: local_registry
  delegate_to: localhost
  become: false
  run_once: true
  when: not _netbox_reachable

- name: Report SSOT lookup result
  ansible.builtin.debug:
    msg:
      - "SSOT source: {{ _ssot_source }}"
      - "VLAN record: {{ _ssot_vlan.name | default('not found') }}"
      - "VID: {{ _ssot_vlan.id | default(target_vlan_id) }}"
      - "VRF: {{ _ssot_vlan.vrf | default('unknown') }}"
      - "Site: {{ _ssot_vlan.site | default('unknown') }}"
  delegate_to: localhost
  become: false
  run_once: true
