---
# Export one VLAN record to NetBox: the VLAN (scoped to this data center like
# netbox_check, so a VID another DC also uses is never touched), its tenant,
# and its prefixes in the record's VRF, assigned to the VLAN.
# plugins/action/netbox_vlan_export.py; every lookup runs before any write.

- name: "Export to NetBox: VLAN {{ _export_vlan.id }}"
  netbox_vlan_export:
    url: "{{ netbox_url }}"
    token: "{{ netbox_token }}"
    validate_certs: "{{ netbox_validate_certs | default(false) | bool }}"
    timeout: "{{ netbox_export_timeout | int }}"
    record: "{{ _export_vlan }}"
    data_center: "{{ target_data_center }}"
    vlan_query: "{{ (netbox_vlan_query_by_dc | default({}))[target_data_center | lower] | default({}) }}"
    site_id: "{{ _netbox_site_id | default(omit) }}"
    dry_run: "{{ netbox_export_dry_run | bool }}"
    create_missing: "{{ netbox_export_create_missing | bool }}"
    update_existing: "{{ netbox_export_update_existing | bool }}"
    export_prefixes: "{{ netbox_export_prefixes | bool }}"
    description_marker: "{{ netbox_export_rt_description_marker }}"
  register: _netbox_vlan_export
  delegate_to: localhost
  become: false

- name: "Record the export result for VLAN {{ _export_vlan.id }}"
  ansible.builtin.set_fact:
    _netbox_export_results: >-
      {{ _netbox_export_results | default([]) + [_netbox_vlan_export
         | dict2items | selectattr('key', 'in', ['vlan_id', 'vlan_name', 'netbox_status', 'netbox_vlan_id',
                                                  'payload', 'prefixes']) | items2dict] }}
  delegate_to: localhost
  become: false
