---
# -----------------------------------------------------------------------------
# netbox_export defaults
# -----------------------------------------------------------------------------
# Standalone export of local VLAN DB records to NetBox. Not part of the Core or
# Advanced migration workflow - run manually when you want to sync inventory.
# -----------------------------------------------------------------------------

netbox_export_dry_run: true
netbox_export_create_missing: true
netbox_export_update_existing: true

# Map data_center keys to NetBox site slugs (customize for your NetBox tenancy).
netbox_export_site_map:
  lisle: lisle
  omaha: omaha

# The VLAN's tenant is the record's numeric tenant id (ownership.tenant),
# looked up by name in NetBox; a tenant NetBox does not have stops that VLAN.
# A new VLAN goes in the DC's VLAN group (netbox_vlan_query_by_dc), else on
# the site below. An existing VLAN keeps its group and site.

# Prefixes: each record prefix in the record's VRF (default = global table),
# assigned to the VLAN and its tenant. The VRF must exist in NetBox (VRFs are
# not created here).
netbox_export_prefixes: true

# Route targets (/ipam/route-targets/): one per migrated VLAN, named
# <l2 vni>:<vlan id>, with the record's tenant (numeric id) and owner
# (customer name) and the description "<vlan name> - <marker>". An existing
# route target with that name is updated, description included. A VLAN whose
# tenant or owner is missing from the record or from NetBox fails the run.
netbox_export_route_targets: true
netbox_export_rt_description_marker: "Created by Ansible VXLAN Automation"

# NetBox API timeout (seconds).
netbox_export_timeout: 30

# Write a JSON artifact of the export result under reports/netbox_export/.
netbox_export_write_artifact: true
netbox_export_artifact_dir: "{{ reports_dir | default(project_root ~ '/reports') }}/netbox_export"
