---
# -----------------------------------------------------------------------------
# Ad-hoc / post-change validation playbook
# -----------------------------------------------------------------------------

- name: Validate network state after VLAN changes
  hosts: network_devices
  gather_facts: false

  roles:
    - network_common

  tasks:
    - name: Show current VLAN database
      ansible.netcommon.cli_command:
        command: show vlan brief
      register: _vlan_brief
      check_mode: false
      changed_when: false

    - name: Show EOS VXLAN vlan-to-vni mappings
      ansible.netcommon.cli_command:
        command: show vxlan vlan-to-vni
      register: _vxlan_vni
      check_mode: false
      changed_when: false
      failed_when: false
      when: network_os_family == 'eos'

    - name: Display state summary
      ansible.builtin.debug:
        msg:
          - "Host: {{ inventory_hostname }}"
          - "VLANs: {{ _vlan_brief.stdout_lines | default([]) | join(' ') }}"
          - "VXLAN: {{ _vxlan_vni.stdout_lines | default([]) | join(' ') }}"
