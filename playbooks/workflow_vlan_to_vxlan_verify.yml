---
# -----------------------------------------------------------------------------
# workflow_vlan_to_vxlan_verify.yml
# -----------------------------------------------------------------------------
# Step 6 of the VLAN->VXLAN migration workflow: post-change verification, with
# rollback + re-verification on failure. Meant to run AFTER the CVP change
# control created by workflow_vlan_to_vxlan_deploy.yml has been approved and
# executed.
#
# Can be run two ways:
#   1. Chained in the same ansible-playbook process right after
#      workflow_vlan_to_vxlan_deploy.yml (e.g. via workflow_vlan_to_vxlan.yml,
#      or manually back-to-back for local testing) -- target_vlan_id etc. are
#      already set as facts on localhost, so the loader play below is a no-op.
#   2. Standalone, asynchronously, once CVP Change Control approval fires --
#      pass -e resume_vlan_id=<id> to load the state persisted by the deploy
#      stage from reports/workflow_state/vlan_<id>.yml. This is how
#      eda/rulebooks/vlan_to_vxlan_migration.yml resumes the workflow.
# -----------------------------------------------------------------------------

- name: Resume — load persisted workflow state for a standalone verify run
  hosts: localhost
  gather_facts: false

  vars:
    workflow_state_dir: "{{ playbook_dir }}/../reports/workflow_state"

  tasks:
    - name: Determine whether workflow state must be loaded from disk
      ansible.builtin.set_fact:
        _resume_needed: "{{ target_vlan_id is not defined and resume_vlan_id | default('', true) | string | length > 0 }}"

    - name: Load persisted workflow state for VLAN {{ resume_vlan_id | default('') }}
      ansible.builtin.include_vars:
        file: "{{ workflow_state_dir }}/vlan_{{ resume_vlan_id }}.yml"
      when: _resume_needed

    - name: Fail if neither live vars nor a resume_vlan_id were provided
      ansible.builtin.fail:
        msg: >-
          workflow_vlan_to_vxlan_verify.yml requires either target_vlan_id to already be set
          (chained from workflow_vlan_to_vxlan_deploy.yml in the same run) or a resume_vlan_id
          extra var pointing at a state file persisted under {{ workflow_state_dir }}.
      when: target_vlan_id is not defined

- name: Step 6 — Validate post-migration state
  hosts: network_devices
  gather_facts: false

  vars:
    target_vrf: "{{ hostvars['localhost']['target_vrf'] | default('default') }}"
    verify_vlan_ids:
      - "{{ hostvars['localhost']['target_vlan_id'] | int }}"
    snow_ticket_sys_id: "{{ hostvars['localhost']['target_ticket_sys_id'] | default('') }}"

  tasks:
    - name: Step 6 — Post-change verification
      block:
        - name: Run the full post-change verification checklist
          ansible.builtin.include_role:
            name: post_change_verification

        - name: Report post-change verification results
          ansible.builtin.debug:
            msg: "{{ _verification_results }}"

        - name: Fail closed if post-change verification did not pass
          ansible.builtin.fail:
            msg:
              - "Post-change verification failed on {{ inventory_hostname }}."
              - "{{ _verification_results | dict2items | selectattr('value.passed', 'equalto', false) | map(attribute='key') | list }}"
              - "Attempting rollback via CVP Change Control (see docs/WORKFLOW_V2.md)."
          when: not _verification_passed | bool
      rescue:
        - name: Attempt rollback via CVP Change Control, then re-verify
          block:
            - name: Skip rollback if it is disabled for this run
              ansible.builtin.fail:
                msg: "auto_rollback_on_verification_failure is false; skipping rollback and escalating directly."
              when: not auto_rollback_on_verification_failure | bool

            - name: Roll back the VXLAN migration configlets via CVP Change Control
              ansible.builtin.include_role:
                name: cvp_rollback

            - name: Re-run the full verification checklist against the restored state
              ansible.builtin.include_role:
                name: post_change_verification
              vars:
                verify_expect_vlan_present: false
                verify_mac_arp_learning: false

            - name: Fail if rollback re-verification did not pass
              ansible.builtin.fail:
                msg:
                  - "Rollback re-verification failed on {{ inventory_hostname }}."
                  - "{{ _verification_results | dict2items | selectattr('value.passed', 'equalto', false) | map(attribute='key') | list }}"
              when: not _verification_passed | bool

            - name: Notify ServiceNow that the migration was rolled back successfully
              ansible.builtin.include_role:
                name: servicenow_update
              vars:
                snow_status_message: >-
                  VLAN {{ hostvars['localhost']['target_vlan_id'] }} migration failed post-change
                  verification and was rolled back successfully via CVP Change Control on
                  {{ inventory_hostname }}. Original failure: {{ ansible_failed_result.msg | default('see task output') }}
                snow_ticket_state: "rolled_back"
              run_once: true

            - name: Mark the run as unsuccessful even though rollback succeeded
              ansible.builtin.fail:
                msg: >-
                  VLAN {{ hostvars['localhost']['target_vlan_id'] }} migration was rolled back
                  successfully after a failed post-change verification on {{ inventory_hostname }}.
                  The migration did not proceed; see ServiceNow for details.
          rescue:
            - name: Notify ServiceNow that verification failed and rollback did not resolve it (escalation)
              ansible.builtin.include_role:
                name: servicenow_update
              vars:
                snow_status_message: >-
                  VLAN {{ hostvars['localhost']['target_vlan_id'] }} migration escalated:
                  post-change verification failed on {{ inventory_hostname }} and either rollback
                  was disabled/failed or rollback re-verification did not pass.
                  {{ ansible_failed_result.msg | default('see task output for details') }}
                snow_ticket_state: "escalated"
              run_once: true

            - name: Re-raise the original failure
              ansible.builtin.fail:
                msg: "{{ ansible_failed_result.msg | default('Step 6 failed on ' + inventory_hostname) }}"

    # Only reached by hosts whose block above succeeded; hosts that failed and
    # were re-raised in rescue are dropped from ansible_play_hosts by Ansible,
    # so this fires once, only when every remaining host passed verification.
    # In a partial-failure run across multiple hosts, this may still fire for
    # the surviving hosts even though another host was escalated separately --
    # both statuses will be visible as separate work notes on the ticket.
    - name: Notify ServiceNow that the migration completed successfully
      ansible.builtin.include_role:
        name: servicenow_update
      vars:
        snow_status_message: "VLAN {{ hostvars['localhost']['target_vlan_id'] }} migration to VXLAN completed and verified successfully."
        snow_ticket_state: "complete"
      run_once: true
