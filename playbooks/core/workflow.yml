---
# -----------------------------------------------------------------------------
# Core workflow - full single-run entry point (deploy + verify, no ServiceNow)
# -----------------------------------------------------------------------------
# Convenient for demos and local testing. Does not wait for CVP change-control
# approval between stages - run deploy and verify separately in production.
#
# Example:
#   ansible-playbook -i inventory/hosts.yml playbooks/core/workflow.yml \
#     -e manual_vlan_id=100 \
#     -e manual_data_center=lisle \
#     -e cvp_apply_configlets=false
# -----------------------------------------------------------------------------

- ansible.builtin.import_playbook: workflow_deploy.yml
- ansible.builtin.import_playbook: workflow_verify.yml
