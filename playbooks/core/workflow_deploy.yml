---
# -----------------------------------------------------------------------------
# Core workflow - deploy stage (Steps 1-5, no ServiceNow)
# -----------------------------------------------------------------------------
# Intake via manual extra vars, local VLAN DB as primary SSOT, discovery,
# cleanup hand-off, and CVP configlet generation. The run ends when configlets
# are in CVP with a pending change control - operator approval is manual.
#
# Post-CVP verification is a separate playbook: workflow_verify.yml
#
# Example:
#   ansible-playbook -i inventory/hosts.yml playbooks/core/workflow_deploy.yml \
#     -e manual_vlan_id=100 \
#     -e manual_data_center=lisle \
#     -e manual_target_vrf=default \
#     -e cvp_apply_configlets=false \
#     --limit dc_lisle
# -----------------------------------------------------------------------------

- name: Core - Steps 1-4 discovery, cleanup hand-off, NetBox sync check
  hosts: network_devices
  gather_facts: false

  vars:
    target_vrf: "{{ hostvars['localhost']['target_vrf'] | default('default') }}"
    _effective_vlans: "{{ hostvars['localhost']['_effective_vlans'] | default([]) }}"
    _discovery_hosts: "{{ hostvars['localhost']['_workflow_discovery_hosts'] | default([]) }}"

  pre_tasks:
    - name: Bootstrap workflow input and VLAN DB on control node
      block:
        - name: Step 1a - Normalize manual workflow input (Core)
          ansible.builtin.include_role:
            name: workflow_input
          when: workflow_tier | default('core') == 'core'

        - name: Step 1b - Normalize ServiceNow workflow input (Advanced)
          ansible.builtin.include_role:
            name: servicenow_input
          when: workflow_tier | default('core') == 'advanced'

        - name: Load optional service bundle (retain / multi-VLAN seeds)
          ansible.builtin.include_role:
            name: service_db

        - name: Load per-DC VLAN database
          ansible.builtin.include_role:
            name: vlan_db
          vars:
            target_data_center: "{{ [manual_data_center | default(''), hostvars['localhost']['target_data_center'] | default('')] | coalesce_trimmed }}"
            target_vlan_ids: "{{ [hostvars['localhost']['target_vlan_id']] if (hostvars['localhost']['target_vlan_id'] | default('', true) | string | length > 0) else [] }}"

        - name: Set workflow-scoped target VLAN list
          ansible.builtin.set_fact:
            target_vlan_ids:
              - "{{ hostvars['localhost']['target_vlan_id'] | int }}"
          when: hostvars['localhost']['target_vlan_id'] is defined
      run_once: true
      delegate_to: localhost
      delegate_facts: true

    - name: Limit discovery to switches declared in the VLAN DB
      ansible.builtin.meta: end_host
      when:
        - _discovery_hosts | length > 0
        - inventory_hostname not in _discovery_hosts

  tasks:
    - name: Steps 2-4 - discovery, cleanup, NetBox
      block:
        - name: Step 2a - Gather common network facts / backup
          ansible.builtin.include_role:
            name: network_common

        - name: Step 2b - Discover legacy VLAN state
          ansible.builtin.include_role:
            name: vlan_discovery

        - name: Step 3 - Hand off discovered VLAN to external cleanup tool
          ansible.builtin.include_role:
            name: external_cleanup
          vars:
            target_vlan_id: "{{ hostvars['localhost']['target_vlan_id'] | int }}"
            target_data_center: "{{ hostvars['localhost']['target_data_center'] | default('') }}"
            target_vrf: "{{ hostvars['localhost']['target_vrf'] | default('') }}"
          run_once: true

        - name: Step 4 - Optional NetBox sync check (secondary SSOT)
          ansible.builtin.include_role:
            name: netbox_check
          vars:
            target_vlan_id: "{{ hostvars['localhost']['target_vlan_id'] | int }}"
          run_once: true
      rescue:
        - name: Notify ServiceNow of failure during discovery/cleanup/NetBox validation (Advanced)
          ansible.builtin.include_role:
            name: servicenow_update
          vars:
            snow_status_message: >-
              VLAN {{ hostvars['localhost']['target_vlan_id'] }} migration failed during
              discovery/cleanup/NetBox validation on {{ inventory_hostname }}:
              {{ ansible_failed_result.msg | default('see task output for details') }}
            snow_ticket_state: "escalated"
          run_once: true
          when:
            - workflow_tier | default('core') == 'advanced'
            - snow_enable_callbacks | default(true) | bool

        - name: Re-raise the original failure
          ansible.builtin.fail:
            msg: "{{ ansible_failed_result.msg | default('Steps 2-4 failed on ' + inventory_hostname) }}"

- name: Core - Step 5 deploy VXLAN migration configlets to Arista CVP
  hosts: eos_devices
  gather_facts: false

  vars:
    _cvp_hosts: "{{ hostvars['localhost']['_workflow_cvp_target_switches'] | default([]) }}"

  pre_tasks:
    - name: Limit CVP deploy to target_switches from the VLAN DB
      ansible.builtin.meta: end_host
      when:
        - _cvp_hosts | length > 0
        - inventory_hostname not in _cvp_hosts

  tasks:
    - name: Step 5 - Generate and push VXLAN configlets
      block:
        - name: Step 5a - Legacy Jinja configlet generation
          ansible.builtin.include_role:
            name: cvp_deploy
          vars:
            target_vlan_id: "{{ hostvars['localhost']['target_vlan_id'] | int }}"
            target_data_center: "{{ hostvars['localhost']['target_data_center'] | default('') }}"
            target_vrf: "{{ hostvars['localhost']['target_vrf'] | default('') }}"
          when: not use_avd | default(false) | bool

        - name: Step 5b - AVD-based configlet generation
          ansible.builtin.include_role:
            name: avd_vxlan_config
          vars:
            target_vlan_id: "{{ hostvars['localhost']['target_vlan_id'] | int }}"
            target_data_center: "{{ hostvars['localhost']['target_data_center'] | default('') }}"
            target_vrf: "{{ hostvars['localhost']['target_vrf'] | default('') }}"
          when: use_avd | default(false) | bool
      rescue:
        - name: Notify ServiceNow of failure during CVP configlet deployment (Advanced)
          ansible.builtin.include_role:
            name: servicenow_update
          vars:
            snow_status_message: >-
              VLAN {{ hostvars['localhost']['target_vlan_id'] }} migration failed during
              CVP configlet generation/deployment on {{ inventory_hostname }}:
              {{ ansible_failed_result.msg | default('see task output for details') }}
            snow_ticket_state: "escalated"
          run_once: true
          when:
            - workflow_tier | default('core') == 'advanced'
            - snow_enable_callbacks | default(true) | bool

        - name: Re-raise CVP deployment failure
          ansible.builtin.fail:
            msg: "{{ ansible_failed_result.msg | default('Step 5 failed on ' + inventory_hostname) }}"

    - name: Persist workflow state for asynchronous verification
      ansible.builtin.file:
        path: "{{ workflow_state_dir }}"
        state: directory
        mode: '0755'
      vars:
        workflow_state_dir: "{{ reports_dir | default(playbook_dir ~ '/../../reports') }}/workflow_state"
      run_once: true
      delegate_to: localhost

    - name: Write workflow state for VLAN {{ hostvars['localhost']['target_vlan_id'] }}
      ansible.builtin.copy:
        dest: "{{ workflow_state_dir }}/vlan_{{ hostvars['localhost']['target_vlan_id'] }}.yml"
        mode: '0644'
        content: |
          ---
          workflow_tier: "{{ workflow_tier | default('core') }}"
          target_vlan_id: {{ hostvars['localhost']['target_vlan_id'] }}
          target_data_center: "{{ hostvars['localhost']['target_data_center'] | default('') }}"
          target_vrf: "{{ hostvars['localhost']['target_vrf'] | default('default') }}"
          target_ticket_sys_id: "{{ target_ticket_sys_id | default('') }}"
          target_switches: {{ hostvars['localhost']['_workflow_cvp_target_switches'] | default([]) | to_json }}
          persisted_at: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"
      vars:
        workflow_state_dir: "{{ reports_dir | default(playbook_dir ~ '/../../reports') }}/workflow_state"
      run_once: true
      delegate_to: localhost

    - name: Notify ServiceNow that the change control is pending approval (Advanced)
      block:
        - name: Update ServiceNow ticket for pending CVP approval
          ansible.builtin.include_role:
            name: servicenow_update
          vars:
            snow_status_message: >-
              VLAN {{ hostvars['localhost']['target_vlan_id'] }} VXLAN migration configlets generated and pushed to CVP.
              A change control is pending approval in CVP before verification runs.
            snow_ticket_state: "wait_for_approval"
      run_once: true
      delegate_to: localhost
      when:
        - workflow_tier | default('core') == 'advanced'
        - snow_enable_callbacks | default(true) | bool
