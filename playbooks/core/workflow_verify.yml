---
# -----------------------------------------------------------------------------
# Core workflow - verify stage (Step 6, no ServiceNow)
# -----------------------------------------------------------------------------
# Post-change verification scoped to target_switches from the local VLAN DB.
#
# Resume after CVP approval:
#   ansible-playbook -i inventory/hosts.yml playbooks/core/workflow_verify.yml \
#     -e resume_vlan_id=100 \
#     --limit dc_lisle
# -----------------------------------------------------------------------------

- name: Core - Step 6 post-change verification
  hosts: eos_devices
  gather_facts: false

  vars:
    target_vrf: "{{ hostvars['localhost']['target_vrf'] | default('default') }}"
    verify_vlan_ids:
      - "{{ hostvars['localhost']['target_vlan_id'] | int }}"
    _cvp_hosts: "{{ hostvars['localhost']['_workflow_cvp_target_switches'] | default([]) }}"
    workflow_state_dir: "{{ reports_dir | default(playbook_dir ~ '/../../reports') }}/workflow_state"

  pre_tasks:
    - name: Bootstrap verify workflow state and VLAN DB on control node
      run_once: true
      delegate_to: localhost
      delegate_facts: true
      block:
        - name: Determine whether workflow state must be loaded from disk
          ansible.builtin.set_fact:
            _resume_needed: "{{ hostvars['localhost']['target_vlan_id'] is not defined and resume_vlan_id | default('', true) | string | length > 0 }}"

        - name: Load persisted workflow state for VLAN {{ resume_vlan_id | default('') }}
          ansible.builtin.include_vars:
            file: "{{ workflow_state_dir }}/vlan_{{ resume_vlan_id }}.yml"
          when: hostvars['localhost']['_resume_needed'] | bool

        - name: Fail if neither live vars nor resume_vlan_id were provided
          ansible.builtin.fail:
            msg: >-
              workflow_verify.yml requires target_vlan_id from a chained deploy run,
              or -e resume_vlan_id=<id> pointing at {{ workflow_state_dir }}/vlan_<id>.yml.
          when: hostvars['localhost']['target_vlan_id'] is not defined

        - name: Reload VLAN DB for verify-scoped facts
          ansible.builtin.include_role:
            name: vlan_db
          vars:
            target_data_center: "{{ [manual_data_center | default(''), hostvars['localhost']['target_data_center'] | default('')] | coalesce_trimmed }}"
            target_vlan_ids:
              - "{{ hostvars['localhost']['target_vlan_id'] | default(resume_vlan_id) | int }}"

    # Same VNI / route targets as the deploy: a VNI NetBox supplied is not in
    # the record on disk. Outside the delegate_facts block above, as in
    # workflow_deploy.yml: netbox_check keeps its facts on the host it runs on
    # (and writes the merged record to localhost itself), so delegated facts
    # would leave its own `when:` checks undefined.
    - name: Read the VNI and route targets from NetBox
      ansible.builtin.include_role:
        name: netbox_check
      vars:
        target_vlan_id: "{{ hostvars['localhost']['target_vlan_id'] | int }}"
        target_data_center: "{{ hostvars['localhost']['_vlan_db_data_center'] | default(manual_data_center | default('')) }}"
      run_once: true

    - name: Limit verification to target_switches from the VLAN DB
      ansible.builtin.meta: end_host
      when:
        - _cvp_hosts | length > 0
        - inventory_hostname not in _cvp_hosts

  tasks:
    - name: Step 6 - Post-change verification
      block:
        - name: Run the full post-change verification checklist
          ansible.builtin.include_role:
            name: post_change_verification

        - name: Keep the migration's verification results for the report
          ansible.builtin.set_fact:
            _verify_report_migration: "{{ _verification_results }}"

        - name: Report post-change verification results
          ansible.builtin.debug:
            msg: "{{ _verification_results }}"

        - name: Fail closed if post-change verification did not pass
          ansible.builtin.fail:
            msg:
              - "Post-change verification failed on {{ inventory_hostname }}."
              - "{{ _verification_results | dict2items | selectattr('value.passed', 'equalto', false) | map(attribute='key') | list }}"
              - "Attempting rollback via CVP Change Control."
          when: not _verification_passed | bool
      rescue:
        - name: Attempt rollback via CVP Change Control, then re-verify
          block:
            - name: Skip rollback if it is disabled for this run
              ansible.builtin.fail:
                msg: "auto_rollback_on_verification_failure is false; skipping rollback."
              when: not auto_rollback_on_verification_failure | bool

            - name: Roll back the VXLAN migration configlets via CVP Change Control
              ansible.builtin.include_role:
                name: cvp_rollback
              vars:
                target_vlan_id: "{{ hostvars['localhost']['target_vlan_id'] | int }}"
                target_data_center: "{{ hostvars['localhost']['target_data_center'] | default('') }}"

            - name: Re-run the full verification checklist against the restored state
              ansible.builtin.include_role:
                name: post_change_verification
              vars:
                verify_expect_vlan_present: false
                verify_mac_arp_learning: false

            - name: Keep the post-rollback verification results for the report
              ansible.builtin.set_fact:
                _verify_report_rollback: "{{ _verification_results }}"

            - name: Fail if rollback re-verification did not pass
              ansible.builtin.fail:
                msg:
                  - "Rollback re-verification failed on {{ inventory_hostname }}."
                  - "{{ _verification_results | dict2items | selectattr('value.passed', 'equalto', false) | map(attribute='key') | list }}"
              when: not _verification_passed | bool

            - name: Notify ServiceNow that the migration was rolled back successfully (Advanced)
              ansible.builtin.include_role:
                name: servicenow_update
              vars:
                snow_status_message: >-
                  VLAN {{ hostvars['localhost']['target_vlan_id'] }} migration failed post-change
                  verification and was rolled back successfully via CVP Change Control on
                  {{ inventory_hostname }}.
                snow_ticket_state: "rolled_back"
              run_once: true
              when:
                - workflow_tier | default('core') == 'advanced'
                - snow_enable_callbacks | default(true) | bool

            - name: Mark the run as unsuccessful even though rollback succeeded
              ansible.builtin.fail:
                msg: >-
                  VLAN {{ hostvars['localhost']['target_vlan_id'] }} migration was rolled back
                  successfully after failed post-change verification on {{ inventory_hostname }}.
          rescue:
            - name: Notify ServiceNow that verification failed and rollback did not resolve it (Advanced)
              ansible.builtin.include_role:
                name: servicenow_update
              vars:
                snow_status_message: >-
                  VLAN {{ hostvars['localhost']['target_vlan_id'] }} migration escalated:
                  post-change verification failed on {{ inventory_hostname }} and rollback
                  did not resolve the issue.
                  {{ ansible_failed_result.msg | default('see task output for details') }}
                snow_ticket_state: "escalated"
              run_once: true
              when:
                - workflow_tier | default('core') == 'advanced'
                - snow_enable_callbacks | default(true) | bool

            - name: Re-raise verification / rollback failure
              ansible.builtin.fail:
                msg: "{{ ansible_failed_result.msg | default('Step 6 failed on ' + inventory_hostname) }}"
      always:
        # One report per VLAN, beside its discovery reports:
        # reports/<dc>/<vlan>/<vlan>_verification_<ts>.{json,md}. Written
        # whether verification passed, failed, or was rolled back.
        - name: Build the VLAN verification report
          ansible.builtin.set_fact:
            _verify_report: >-
              {{ _verify_switches | build_verification_report(hostvars['localhost']['_target_vlan_record'] | default({}), {
                   'vlan_id': hostvars['localhost']['target_vlan_id'] | int,
                   'data_center': _verify_dc,
                   'change_control_id': hostvars['localhost']['cvp_change_control_id']
                                        | default((hostvars['localhost']['_cvp_deploy'] | default({})).change_control_id | default(''), true),
                   'deploy_method': hostvars['localhost']['cvp_deploy_method'] | default(cvp_deploy_method | default('configlets'), true),
                   'verified_at': _verify_ts,
                   'auto_rollback': auto_rollback_on_verification_failure | bool}) }}
          vars:
            _verify_dc: "{{ hostvars['localhost']['_vlan_db_data_center'] | default(hostvars['localhost']['target_data_center'] | default('unknown'), true) }}"
            _verify_ts: "{{ lookup('ansible.builtin.pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"
            _verify_switches: >-
              {% set out = [] %}{% for host in (_cvp_hosts or ansible_play_hosts_all) | sort %}{% set _ = out.append({
                'host': host,
                'migration': hostvars[host]['_verify_report_migration'] | default({}),
                'rollback': hostvars[host]['_verify_report_rollback'] | default({})}) %}{% endfor %}{{ out }}
          run_once: true
          delegate_to: localhost
          delegate_facts: true

        - name: Create the VLAN report directory
          ansible.builtin.file:
            path: >-
              {{ reports_dir | default(playbook_dir ~ '/../../reports') }}/{{ hostvars['localhost']['_verify_report'].data_center
              }}/{{ hostvars['localhost']['_verify_report'].vlan_slug }}
            state: directory
            mode: '0755'
          run_once: true
          delegate_to: localhost

        - name: Write the VLAN verification report
          ansible.builtin.copy:
            content: "{{ item.content }}"
            dest: "{{ _verify_report_path }}.{{ item.ext }}"
            mode: '0644'
          loop:
            - {ext: json, content: "{{ hostvars['localhost']['_verify_report'] | to_nice_json }}\n"}
            - {ext: md, content: "{{ hostvars['localhost']['_verify_report'] | verification_report_markdown }}"}
          loop_control:
            label: "{{ _verify_report_path }}.{{ item.ext }}"
          vars:
            _r: "{{ hostvars['localhost']['_verify_report'] }}"
            _verify_report_path: >-
              {{ reports_dir | default(playbook_dir ~ '/../../reports') }}/{{ _r.data_center }}/{{ _r.vlan_slug }}/{{
                 _r.vlan_slug }}_verification_{{ _r.meta.verified_at | regex_replace('[-:]', '') }}
          run_once: true
          delegate_to: localhost

        - name: Report the verification outcome
          ansible.builtin.debug:
            msg:
              - "VLAN {{ hostvars['localhost']['_verify_report'].vlan_id }}: {{ hostvars['localhost']['_verify_report'].outcome }}"
              - "Failed checks: {{ hostvars['localhost']['_verify_report'].failed_checks | length }}"
          run_once: true

    - name: Notify ServiceNow that the migration completed successfully (Advanced)
      ansible.builtin.include_role:
        name: servicenow_update
      vars:
        snow_status_message: >-
          VLAN {{ hostvars['localhost']['target_vlan_id'] }} migration to VXLAN completed
          and verified successfully.
        snow_ticket_state: "complete"
      run_once: true
      when:
        - workflow_tier | default('core') == 'advanced'
        - snow_enable_callbacks | default(true) | bool
