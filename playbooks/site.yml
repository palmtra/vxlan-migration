---
# -----------------------------------------------------------------------------
# Site playbook: migrate AND/OR decommission VLANs in a single AAP workflow.
#
# By default this runs both streams.  To scope the run use target_actions:
#   ansible-playbook playbooks/site.yml -e target_actions='["migrate"]'
#   ansible-playbook playbooks/site.yml -e target_actions='["decommission"]'
# -----------------------------------------------------------------------------

- name: VLAN lifecycle operations
  hosts: network_devices
  gather_facts: false
  # target_actions defaults to ['migrate', 'decommission'] in group_vars/all.yml.
  # Override via -e target_actions='["migrate"]' or an AAP survey.

  roles:
    - network_common
    - migrate_to_vxlan
    - decommission_vlan
