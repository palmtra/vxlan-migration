---
# -----------------------------------------------------------------------------
# Dry-run decommission plan
# -----------------------------------------------------------------------------
# Produces a machine-readable CSV of what would be removed (SVIs, trunks, VLANs)
# without making any changes.
#
# Usage:
#   ansible-playbook -i inventory/hosts.yml playbooks/dry_run_decommission.yml \
#     --limit dc_lisle -e target_vlan_ids='[900,910]'
# -----------------------------------------------------------------------------

- name: Generate dry-run decommission plan
  hosts: network_devices
  gather_facts: false
  vars:
    target_actions:
      - decommission

  roles:
    - network_common

  tasks:
    - name: Discover trunk interfaces for dry-run plan
      ansible.netcommon.cli_command:
        command: "{{ _trunk_show_command }}"
      vars:
        _trunk_show_command: >-
          {%- if network_os_family == 'eos' -%} show interfaces switchport
          {%- elif network_os_family == 'nxos' -%} show interface trunk
          {%- else -%} show interfaces trunk
          {%- endif -%}
      register: _dry_trunk_output
      check_mode: false
      changed_when: false
      failed_when: false

    - name: Build trunk list for dry-run plan
      ansible.builtin.set_fact:
        _dry_trunk_interfaces: "{{ (_dry_trunk_output.stdout | default('')) | regex_findall(_trunk_regex) }}"
      vars:
        _trunk_regex: >-
          {%- if network_os_family == 'eos' -%} (?s)Name: (\S+).*?Operational Mode: trunk
          {%- elif network_os_family == 'nxos' -%} (?i)^(Ethernet\S+|port-channel\S+)\s+
          {%- else -%} ^(\S+)\s+\S+\s+\S+\s+trunking
          {%- endif -%}

    - name: Ensure reports directory exists
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../reports"
        state: directory
        mode: '0755'
      delegate_to: localhost
      become: false
      check_mode: false

    - name: Write dry-run decommission plan
      ansible.builtin.template:
        src: dry_run_decommission.csv.j2
        dest: "{{ playbook_dir }}/../reports/dry_run_decommission.csv"
        mode: '0644'
      delegate_to: localhost
      become: false
      run_once: true
