---
# -----------------------------------------------------------------------------
# workflow_vlan_to_vxlan_deploy.yml
# -----------------------------------------------------------------------------
# Steps 1-5 of the VLAN->VXLAN migration workflow: normalize the ServiceNow
# change-ticket input, discover legacy state, hand off to external cleanup,
# validate the target VLAN against NetBox (or the local registry fallback),
# and generate/push the VXLAN migration configlets to Arista CVP, creating a
# (by default) PENDING change control that requires manual approval in CVP.
#
# This playbook intentionally stops there. Once the change control is
# approved and executed in CVP, playbooks/workflow_vlan_to_vxlan_verify.yml
# resumes the workflow with post-change verification (and rollback if
# needed). See eda/rulebooks/vlan_to_vxlan_migration.yml for how these two
# stages are wired together as an event-driven, non-blocking workflow instead
# of a single long-running playbook that would otherwise have to poll/fail
# while waiting for a human to approve the change control.
#
# Expected input (ServiceNow webhook / extra vars):
#   snow_vlan_id: <vlan-id>
#   snow_data_center: <dc-name>
#   snow_target_vrf: <vrf-name>
#   snow_ticket_sys_id: <sys_id>
#
# For local testing you may instead pass:
#   -e manual_vlan_id=100 -e manual_data_center=lisle -e manual_target_vrf=default
#
# Scope to a data center with --limit, e.g. --limit dc_lisle.
#
# Set -e use_avd=true to generate Arista CVP configlets with the
# arista.avd.eos_cli_config_gen role instead of the legacy custom Jinja path.
# -----------------------------------------------------------------------------

- name: Step 1-4 — Normalize input, discover state, hand off cleanup, check NetBox
  hosts: network_devices
  gather_facts: false

  vars:
    snow_ticket_sys_id: "{{ hostvars['localhost']['target_ticket_sys_id'] | default('') }}"

  pre_tasks:
    - name: Step 1 — Normalize change-ticket input
      ansible.builtin.include_role:
        name: servicenow_input
      run_once: true

    - name: Set workflow-scoped target VLAN list
      ansible.builtin.set_fact:
        target_vlan_ids:
          - "{{ hostvars['localhost']['target_vlan_id'] | int }}"

  tasks:
    - name: Steps 2-4 — discovery, cleanup hand-off, NetBox validation
      block:
        - name: Step 2a — Gather common network facts / backup
          ansible.builtin.include_role:
            name: network_common

        - name: Step 2b — Discover legacy VLAN state
          ansible.builtin.include_role:
            name: vlan_discovery

        - name: Step 3 — Hand off discovered VLAN to external cleanup tool
          ansible.builtin.include_role:
            name: external_cleanup
          vars:
            target_vlan_id: "{{ hostvars['localhost']['target_vlan_id'] | int }}"
            target_data_center: "{{ hostvars['localhost']['target_data_center'] | default('') }}"
            target_vrf: "{{ hostvars['localhost']['target_vrf'] | default('') }}"
          run_once: true

        - name: Step 4 — Verify VLAN exists in NetBox (or local registry fallback)
          ansible.builtin.include_role:
            name: netbox_check
          vars:
            target_vlan_id: "{{ hostvars['localhost']['target_vlan_id'] | int }}"
          run_once: true
      rescue:
        - name: Notify ServiceNow of failure during discovery/cleanup/NetBox validation
          ansible.builtin.include_role:
            name: servicenow_update
          vars:
            snow_status_message: >-
              VLAN {{ hostvars['localhost']['target_vlan_id'] }} migration failed during
              discovery/cleanup/NetBox validation on {{ inventory_hostname }}:
              {{ ansible_failed_result.msg | default('see task output for details') }}
            snow_ticket_state: "escalated"
          run_once: true

        - name: Re-raise the original failure
          ansible.builtin.fail:
            msg: "{{ ansible_failed_result.msg | default('Steps 2-4 failed on ' + inventory_hostname) }}"

- name: Step 5 — Deploy VXLAN migration configlets to Arista CVP
  hosts: "{{ use_avd | default(false) | bool | ternary('eos_devices', 'localhost') }}"
  gather_facts: false

  vars:
    snow_ticket_sys_id: "{{ hostvars['localhost']['target_ticket_sys_id'] | default('') }}"

  tasks:
    - name: Step 5 — Generate and push VXLAN configlets
      block:
        - name: Step 5a — Legacy Jinja configlet generation
          ansible.builtin.include_role:
            name: cvp_deploy
          vars:
            target_vlan_id: "{{ hostvars['localhost']['target_vlan_id'] | int }}"
            target_data_center: "{{ hostvars['localhost']['target_data_center'] | default('') }}"
            target_vrf: "{{ hostvars['localhost']['target_vrf'] | default('') }}"
          when: not use_avd | default(false) | bool

        - name: Step 5b — AVD-based configlet generation
          ansible.builtin.include_role:
            name: avd_vxlan_config
          vars:
            target_vlan_id: "{{ hostvars['localhost']['target_vlan_id'] | int }}"
            target_data_center: "{{ hostvars['localhost']['target_data_center'] | default('') }}"
            target_vrf: "{{ hostvars['localhost']['target_vrf'] | default('') }}"
          when: use_avd | default(false) | bool
      rescue:
        - name: Notify ServiceNow of failure during CVP configlet deployment
          ansible.builtin.include_role:
            name: servicenow_update
          vars:
            snow_status_message: >-
              VLAN {{ hostvars['localhost']['target_vlan_id'] }} migration failed during
              CVP configlet generation/deployment on {{ inventory_hostname }}:
              {{ ansible_failed_result.msg | default('see task output for details') }}
            snow_ticket_state: "escalated"
          run_once: true

        - name: Re-raise the original failure
          ansible.builtin.fail:
            msg: "{{ ansible_failed_result.msg | default('Step 5 failed on ' + inventory_hostname) }}"

- name: Persist workflow state so verification can resume asynchronously later
  hosts: localhost
  gather_facts: false

  vars:
    workflow_state_dir: "{{ playbook_dir }}/../reports/workflow_state"

  tasks:
    - name: Ensure workflow state directory exists
      ansible.builtin.file:
        path: "{{ workflow_state_dir }}"
        state: directory
        mode: '0755'

    - name: Write workflow state for VLAN {{ target_vlan_id }}
      ansible.builtin.copy:
        dest: "{{ workflow_state_dir }}/vlan_{{ target_vlan_id }}.yml"
        mode: '0644'
        content: |
          ---
          # Persisted by playbooks/workflow_vlan_to_vxlan_deploy.yml so that
          # playbooks/workflow_vlan_to_vxlan_verify.yml can resume this
          # workflow asynchronously once CVP Change Control is approved.
          # See eda/rulebooks/vlan_to_vxlan_migration.yml.
          target_vlan_id: {{ target_vlan_id }}
          target_data_center: "{{ target_data_center | default('') }}"
          target_vrf: "{{ target_vrf | default('default') }}"
          target_ticket_sys_id: "{{ target_ticket_sys_id | default('') }}"
          persisted_at: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"

    - name: Notify ServiceNow that the change control is pending approval
      ansible.builtin.include_role:
        name: servicenow_update
      vars:
        snow_status_message: >-
          VLAN {{ target_vlan_id }} VXLAN migration configlets generated and pushed to CVP.
          A change control is pending approval in CVP before the change is executed and
          post-change verification runs.
        snow_ticket_state: "wait_for_approval"
